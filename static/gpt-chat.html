        body.theme-dark .thread-menu-popover { background:var(--chat-panel) !important; border-color:var(--chat-line) !important; }

        @media (max-width:900px){
            .chat-shell,.chat-shell.sidebar-collapsed { display:block; }
            .conversation-sidebar { position:absolute; inset:0 auto 0 0; width:min(286px,86vw); transform:translateX(-102%); opacity:1; pointer-events:none; box-shadow:18px 0 42px rgba(15,23,42,.22); }
            .chat-shell.sidebar-mobile-open .conversation-sidebar { transform:translateX(0); pointer-events:auto; }
            .sidebar-collapsed .conversation-sidebar { opacity:1; }
            .sidebar-backdrop { position:absolute; inset:0; z-index:29; background:rgba(15,23,42,.28); }
            .chat-shell.sidebar-mobile-open .sidebar-backdrop { display:block; }
            .sidebar-open-btn,.sidebar-collapsed .sidebar-open-btn { display:flex; }
            .conversation-sidebar-head { height:62px; }
            .jinni-workspace { padding:16px 14px 36px; }
            .jinni-hero { padding:18px; grid-template-columns:1fr; }
            .jinni-grid { grid-template-columns:1fr; }
            .jinni-manager-toolbar { align-items:stretch; flex-direction:column; }
            .jinni-search { width:100%; }
            .jinni-form { padding:14px; grid-template-columns:1fr; }
            .jinni-field.wide { grid-column:1; }
            .jinni-capabilities { grid-template-columns:1fr; }
            .jinni-kb-list { grid-template-columns:1fr; }
            .knowledge-picker-list,.knowledge-picker-modes { grid-template-columns:1fr; }
            .knowledge-picker-modal { padding:10px; align-items:flex-end; }
            .knowledge-picker-dialog { max-height:88vh; border-radius:17px 17px 10px 10px; }
            .jinni-starter-chips { grid-template-columns:1fr; }
            .jinni-editor-head { align-items:flex-start; flex-direction:column; }
        }
    </style>
</head>
<body>
    <div id="chatShell" class="chat-shell">
        <aside id="conversationSidebar" class="conversation-sidebar" aria-label="会话列表">
            <div class="conversation-sidebar-head">
                <div class="conversation-sidebar-title">头脑风暴</div>
                <button type="button" class="sidebar-icon-btn" onclick="toggleConversationSidebar(false)" title="收起会话栏" aria-label="收起会话栏"><i data-lucide="panel-left-close"></i></button>
            </div>
            <button type="button" class="sidebar-primary" onclick="newConversation()"><i data-lucide="square-pen"></i><span>发起新聊天</span></button>
            <label class="conversation-search" aria-label="搜索对话">
                <i data-lucide="search"></i>
                <input id="conversationSearch" type="search" placeholder="搜索对话" oninput="handleConversationSearch(this.value)">
            </label>
            <section class="jinni-sidebar" aria-label="Jinni 智能体">
                <div class="jinni-sidebar-head">
                    <span class="jinni-sidebar-title">Jinni</span>
                </div>
                <div id="jinniQuickList" class="jinni-quick-list"></div>
                <button id="jinniManagerLink" type="button" class="jinni-manager-link" onclick="showJinniManager()"><i data-lucide="sparkles"></i><span>Jinni 管理器</span></button>
            </section>
            <div id="threadList" class="thread-list"></div>
        </aside>
        <button type="button" class="sidebar-backdrop" onclick="toggleConversationSidebar(false)" aria-label="关闭会话栏"></button>
        <main class="chat-main">
            <header class="topbar">
                <div class="topbar-inner">
                    <div class="topbar-left">
                        <button type="button" class="action-btn sidebar-open-btn" onclick="toggleConversationSidebar(true)" title="打开会话栏" aria-label="打开会话栏"><i data-lucide="panel-left-open"></i></button>
                        <div class="title-block">
                            <h1 id="chatTitle" data-i18n="chat.newConversation">新对话</h1>
                        </div>
                    </div>
                    <div class="top-actions">
                        <button onclick="event.stopPropagation();newConversation()" class="action-btn" title="新建对话" data-i18n-title="chat.newConversation"><i data-lucide="plus"></i><span data-i18n="chat.new">新建</span></button>
                        <button id="systemPromptBtn" onclick="event.stopPropagation();toggleSystemPrompt()" class="action-btn" title="系统提示词"><i data-lucide="sliders-horizontal"></i><span>系统</span></button>
                        <aside id="systemPromptPopover" class="system-prompt-popover" onclick="event.stopPropagation()">
                            <div class="system-prompt-head">
                                <div class="system-prompt-title">系统提示词</div>
                                <button onclick="event.stopPropagation();toggleSystemPrompt(false)" class="rail-close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
                            </div>
                            <textarea id="systemPromptInput" class="system-prompt-textarea" placeholder="例如：你是一个专业图片创作助手，回答要简洁，并优先给出可执行步骤。"></textarea>
                            <div class="system-prompt-actions">
                                <button type="button" onclick="clearSystemPrompt()">清空</button>
                                <button type="button" class="primary" onclick="saveSystemPromptFromUI()">保存</button>
                            </div>
                        </aside>
                    </div>
                </div>
            </header>

            <section id="jinniWorkspace" class="jinni-workspace" hidden></section>

            <section id="messages" class="messages"></section>

            <div class="composer-wrap">
                <div class="composer">
                    <div id="composerBody" class="composer-body">
                        <textarea id="messageInput" rows="4" placeholder="输入消息，Enter 发送..." data-i18n-placeholder="chat.inputPlaceholder" oninput="autoGrow(this)" onkeydown="handleKey(event)"></textarea>
                        <div id="refStrip" class="ref-strip"></div>
                        <div class="composer-inside-foot">
                            <div class="left-tools">
                                <div class="inline-controls">
                                    <label class="upload-btn" title="上传附件" aria-label="上传附件">
                                        <input id="attachmentInput" class="file-input" type="file" multiple onchange="uploadFiles(this.files); this.value='';">
                                        <i data-lucide="paperclip"></i>
                                    </label>
                                    <select id="knowledgeModeSelect" class="knowledge-mode-select" title="Jinni 知识模式" onchange="setConversationKnowledgeMode(this.value)"></select>
                                    <button id="ordinaryKnowledgeBtn" type="button" class="ordinary-kb-trigger" onclick="openOrdinaryKnowledgePicker()" title="为普通聊天添加知识库"><i data-lucide="plus"></i><span>知识库</span></button>
                                    <div id="modelPicker" class="model-picker">
                                        <button id="modelPickerBtn" class="model-picker-button" onclick="event.stopPropagation();toggleModelPicker()" title="选择平台和模型">
                                            <i data-lucide="boxes"></i>
                                            <span class="model-picker-labels">
                                                <span id="modelPickerProvider" class="model-picker-provider">API</span>
                                                <span class="model-picker-dot"></span>
                                                <span id="modelPickerModel" class="model-picker-model">Model</span>
                                            </span>
                                            <i data-lucide="chevron-up"></i>
                                        </button>
                                        <div id="modelPickerPopover" class="model-picker-popover" onclick="event.stopPropagation()">
                                            <div class="model-picker-head">
                                                <div id="modelPickerTitle" class="model-picker-title">模型选择</div>
                                                <div id="modelPickerScope" class="model-picker-scope"></div>
                                            </div>
                                            <div class="model-picker-body">
                                                <div id="modelProviderList" class="model-picker-list"></div>
                                                <div id="modelList" class="model-picker-list"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div id="imageControls" class="image-controls hidden">
                                        <div id="resolutionPicker" class="resolution-picker" title="比例和分辨率">
                                            <button id="resolutionPickerBtn" class="resolution-picker-button" onclick="event.stopPropagation();toggleResolutionPicker()" title="比例和分辨率">
                                                <i data-lucide="ruler"></i>
                                                <span class="resolution-picker-labels">
                                                    <span id="resolutionPickerType" class="resolution-picker-type">尺寸</span>
                                                    <span class="resolution-picker-dot"></span>
                                                    <span id="resolutionPickerValue" class="resolution-picker-value">自动</span>
                                                </span>
                                                <i data-lucide="chevron-up"></i>
                                            </button>
                                            <div id="resolutionPickerPopover" class="resolution-picker-popover" onclick="event.stopPropagation()">
                                                <div class="resolution-picker-head">
                                                    <div class="resolution-picker-title">尺寸选择</div>
                                                    <div id="resolutionPickerScope" class="resolution-picker-scope">
                                                        <button id="resolutionScopeAuto" type="button" class="active" onclick="setResolutionPickerScope('auto')">自动</button>
                                                        <button id="resolutionScopePreset" type="button" onclick="setResolutionPickerScope('preset')">内置尺寸</button>
                                                        <button id="resolutionScopeCustom" type="button" onclick="setResolutionPickerScope('custom')">自定义</button>
                                                    </div>
                                                </div>
                                                <div id="resolutionAutoPane" class="resolution-picker-pane custom">
                                                    <div class="resolution-custom-box">
                                                        <div class="resolution-custom-title">自动尺寸</div>
                                                        <div class="resolution-custom-hint">默认 1024x1024；提示词包含比例或明确尺寸时自动匹配。</div>
                                                    </div>
                                                </div>
                                                <div id="resolutionPresetPane" class="resolution-picker-pane preset hidden">
                                                    <div id="resolutionRatioList" class="resolution-picker-list">
                                                        <button id="chat-ratio-square" type="button" class="resolution-picker-option active" onclick="selectBuiltInRatio('square')"><span>1:1</span><small>正方形</small></button>
                                                        <button id="chat-ratio-portrait" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('portrait')"><span>2:3</span><small>竖图</small></button>
                                                        <button id="chat-ratio-landscape" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('landscape')"><span>3:2</span><small>横图</small></button>
                                                        <button id="chat-ratio-portrait43" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('portrait43')"><span>3:4</span><small>竖图</small></button>
                                                        <button id="chat-ratio-landscape43" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('landscape43')"><span>4:3</span><small>横图</small></button>
                                                        <button id="chat-ratio-story" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('story')"><span>9:16</span><small>竖屏</small></button>
                                                        <button id="chat-ratio-wide" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('wide')"><span>16:9</span><small>宽屏</small></button>
                                                    </div>
                                                    <div id="resolutionLevelList" class="resolution-picker-list">
                                                        <button type="button" class="resolution-picker-option" data-resolution="1k" onclick="selectResolutionPreset('1k')"><span>1K</span><small id="resolutionPreset1k">1024x1024</small></button>
                                                        <button type="button" class="resolution-picker-option" data-resolution="2k" onclick="selectResolutionPreset('2k')"><span>2K</span><small id="resolutionPreset2k">1536x1536</small></button>
                                                        <button type="button" class="resolution-picker-option" data-resolution="4k" onclick="selectResolutionPreset('4k')"><span>4K</span><small id="resolutionPreset4k">2048x2048</small></button>
                                                    </div>
                                                </div>
                                                <div id="resolutionCustomPane" class="resolution-picker-pane custom hidden">
                                                    <div class="resolution-custom-box">
                                                        <div class="resolution-custom-title">自定义分辨率</div>
                                                        <div class="resolution-custom-row">
                                                            <input id="customResolutionWidth" type="number" min="256" max="8192" step="1" placeholder="宽">
                                                            <span>x</span>
                                                            <input id="customResolutionHeight" type="number" min="256" max="8192" step="1" placeholder="高">
                                                            <button type="button" onclick="applyCustomResolution()">应用</button>
                                                        </div>
                                                        <div id="customResolutionHint" class="resolution-custom-hint">输入 256-8192 之间的宽度和高度</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button id="sendBtn" onclick="sendMessage()" class="send-btn" title="发送" data-i18n-title="chat.send"><i data-lucide="send"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="imagePreviewModal" class="image-preview-modal" onclick="closeImagePreview()">
        <button class="image-preview-close" title="关闭" aria-label="关闭" onclick="event.stopPropagation();closeImagePreview()"><i data-lucide="x"></i></button>
        <img id="imagePreviewImg" src="" alt="preview" onclick="event.stopPropagation()">
    </div>
    <div id="confirmModal" class="confirm-modal" hidden onclick="if(event.target===this) resolveConfirmDialog(false)">
        <section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmDialogTitle" aria-describedby="confirmDialogMessage" onclick="event.stopPropagation()">
            <div class="confirm-dialog-head">
                <div class="confirm-dialog-icon"><i data-lucide="trash-2"></i></div>
                <div class="confirm-dialog-copy">
                    <h2 id="confirmDialogTitle" class="confirm-dialog-title">确认删除？</h2>
                    <p id="confirmDialogMessage" class="confirm-dialog-message"></p>
                </div>
            </div>
            <div class="confirm-dialog-actions">
                <button id="confirmDialogCancel" type="button" onclick="resolveConfirmDialog(false)">取消</button>
                <button id="confirmDialogAccept" type="button" class="danger" onclick="resolveConfirmDialog(true)">确认删除</button>
            </div>
        </section>
    </div>
    <div id="knowledgePickerModal" class="knowledge-picker-modal" hidden onclick="if(event.target===this) closeOrdinaryKnowledgePicker()">
        <section class="knowledge-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="knowledgePickerTitle" onclick="event.stopPropagation()">
            <div class="knowledge-picker-head"><div><h2 id="knowledgePickerTitle">为当前聊天添加知识库</h2><p>普通聊天可自由选择知识范围，不会改变任何 Jinni 配置。</p></div><button type="button" class="jinni-row-remove" onclick="closeOrdinaryKnowledgePicker()" aria-label="关闭"><i data-lucide="x"></i></button></div>
            <div id="knowledgePickerBody" class="knowledge-picker-body"></div>
            <div class="knowledge-picker-foot"><button type="button" class="knowledge-picker-btn" onclick="clearOrdinaryKnowledge()">清除知识库</button><div><button type="button" class="knowledge-picker-btn" onclick="closeOrdinaryKnowledgePicker()">取消</button><button type="button" class="knowledge-picker-btn primary" onclick="saveOrdinaryKnowledge()">应用到当前聊天</button></div></div>
        </section>
    </div>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function defaultTitle(){ return tr('chat.newConversation'); }
        function setChatTitle(title){
            document.getElementById('chatTitle').textContent = title || defaultTitle();
        }
        let confirmDialogResolver = null;
        let confirmDialogPreviousFocus = null;
        function showConfirmDialog({title='确认操作？',message='',confirmText='确认',cancelText='取消'}={}){
            if(confirmDialogResolver) resolveConfirmDialog(false);
            const modal = document.getElementById('confirmModal');
            confirmDialogPreviousFocus = document.activeElement;
            document.getElementById('confirmDialogTitle').textContent = title;
            document.getElementById('confirmDialogMessage').textContent = message;
            document.getElementById('confirmDialogAccept').textContent = confirmText;
            document.getElementById('confirmDialogCancel').textContent = cancelText;
            modal.hidden = false;
            requestAnimationFrame(() => document.getElementById('confirmDialogCancel')?.focus());
            return new Promise(resolve => { confirmDialogResolver = resolve; });
        }
        function resolveConfirmDialog(accepted=false){
            if(!confirmDialogResolver) return;
            const resolve = confirmDialogResolver;
            const previousFocus = confirmDialogPreviousFocus;
            confirmDialogResolver = null;
            confirmDialogPreviousFocus = null;
            document.getElementById('confirmModal').hidden = true;
            resolve(!!accepted);
            requestAnimationFrame(() => previousFocus?.isConnected && previousFocus.focus());
        }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        });
        window.addEventListener('resize', () => {
            if(document.getElementById('modelPicker')?.classList.contains('open')) positionModelPicker();
            if(document.getElementById('resolutionPicker')?.classList.contains('open')) positionResolutionPicker();
        });
        function uuid(){
            if(crypto?.randomUUID) return crypto.randomUUID();
            return 'u-' + Math.random().toString(16).slice(2) + Date.now();
        }

        const USER_KEY = 'gpt_chat_browser_user';
        const CHAT_SETTINGS_KEY = 'gpt_chat_settings_v1';
        const CHAT_LAST_CONVERSATION_KEY = 'gpt_chat_last_conversation_v1';
        const CHAT_ATTACHMENT_MAX = 20;
        const CHAT_SIZE_MODE_VERSION = 2;
        const userId = localStorage.getItem(USER_KEY) || uuid();
        localStorage.setItem(USER_KEY, userId);

        function readChatSettings(){
            try {
                const raw = localStorage.getItem(CHAT_SETTINGS_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch(e) {
                return {};
            }
        }

        function isObject(value){
            return value && typeof value === 'object' && !Array.isArray(value);
        }

        const savedChatSettings = readChatSettings();
        let conversations = [];
        let currentConversation = null;
        const runStates = new Map();
        const conversationScrollPositions = new Map();
        let conversationSearch = '';
        let conversationSearchTimer = null;
        let runPollTimer = null;
        let lastRenderedRunSignature = '';
        let mode = 'agent';
        let provider = savedChatSettings.provider || 'comfly';
        let msModel = savedChatSettings.msModel || '';
        let activeChatModel = savedChatSettings.activeChatModel || '';
        let activeImageProvider = savedChatSettings.activeImageProvider || 'comfly';
        let activeImageModel = savedChatSettings.activeImageModel || '';
        let systemPrompt = String(savedChatSettings.systemPrompt || '').trim();
        let apiProviders = [];
        let chatProviderModels = isObject(savedChatSettings.chatProviderModels) ? savedChatSettings.chatProviderModels : {};
        let chatRatio = ['square','portrait','portrait43','landscape43','landscape','story','wide'].includes(savedChatSettings.chatRatio) ? savedChatSettings.chatRatio : 'square';
        let chatResolution = savedChatSettings.chatSizeModeVersion === CHAT_SIZE_MODE_VERSION && ['auto','1k','2k','4k','custom'].includes(savedChatSettings.chatResolution) ? savedChatSettings.chatResolution : 'auto';
        let chatPresetResolution = ['1k','2k','4k'].includes(savedChatSettings.chatPresetResolution) ? savedChatSettings.chatPresetResolution : (chatResolution === 'custom' ? '1k' : chatResolution);
        let chatCustomSize = normalizeChatCustomSize(savedChatSettings.chatCustomSize || '') || '1024x1024';
        let modelPickerScope = savedChatSettings.modelPickerScope === 'image' ? 'image' : 'chat';
        let modelPickerHome = null;
        let resolutionPickerHome = null;
        let refs = [];
        let config = { chat_model: 'gpt-5.5', image_model: 'gpt-image-2', ms_chat_models: [] };
        let jinnis = [];
        let knowledgeBases = [];
        let ordinaryKnowledgeDraft = {mode:'none',knowledge_base_ids:[]};
        let ordinaryKnowledgeEditing = null;
        let jinniWorkspaceMode = 'chat';
        let editingJinni = null;
        let editingKnowledgeFiles = [];
        let jinniSearchTimer = null;
        let conversationTransitioning = false;

        const SIZE_OPTIONS = {
            square: [['1024x1024','1k'], ['1536x1536','2k'], ['2048x2048','4k']],
            portrait: [['720x1080','1k'], ['1024x1536','2k'], ['1365x2048','4k']],
            portrait43: [['1008x1344','1k'], ['1536x2048','2k'], ['2448x3264','4k']],
            landscape43: [['1344x1008','1k'], ['2048x1536','2k'], ['3264x2448','4k']],
            landscape: [['1080x720','1k'], ['1536x1024','2k'], ['2048x1365','4k']],
            story: [['720x1280','1k'], ['1080x1920','2k'], ['1440x2560','4k']],
            wide: [['1280x720','1k'], ['1920x1080','2k'], ['2560x1440','4k']]
        };

        const headers = () => ({'Content-Type':'application/json', 'X-User-ID':userId});

        function currentJinniSnapshot(){
            return isObject(currentConversation?.jinni_snapshot) ? currentConversation.jinni_snapshot : null;
        }

        function jinniAvatarMarkup(jinni, className='jinni-avatar'){
            const avatar = String(jinni?.avatar_url || '').trim();
            const fallback = escapeHtml(String(jinni?.name || 'J').trim().slice(0,1).toUpperCase() || 'J');
            return `<span class="${className}">${avatar ? `<img src="${escapeHtml(avatar)}" alt="">` : fallback}</span>`;
        }

        function updateWorkspaceChrome(){
            const shell = document.getElementById('chatShell');
            const workspace = document.getElementById('jinniWorkspace');
            const managerLink = document.getElementById('jinniManagerLink');
            const systemButton = document.getElementById('systemPromptBtn');
            const inManager = jinniWorkspaceMode !== 'chat';
            shell?.classList.toggle('jinni-workspace-open', inManager);
            if(workspace) workspace.hidden = !inManager;
            managerLink?.classList.toggle('active', inManager);
            if(systemButton){
                const locked = inManager || !!currentJinniSnapshot();
                systemButton.disabled = locked;
                systemButton.title = locked ? 'Jinni 指令请在 Jinni 管理器中编辑' : '系统提示词';
                systemButton.style.opacity = locked ? '.48' : '';
            }
        }

        function showChatWorkspace(){
            jinniWorkspaceMode = 'chat';
            updateWorkspaceChrome();
        }

        function showJinniManager(){
            jinniWorkspaceMode = 'manager';
            setChatTitle('Jinni 管理器');
            updateWorkspaceChrome();
            renderJinniManager();
            if(window.innerWidth <= 900) toggleConversationSidebar(false);
        }

        async function loadJinnis(query=''){
            try {
                const response = await fetch(`/api/jinnis?q=${encodeURIComponent(query)}`, {headers:{'X-User-ID':userId}});
                const data = await response.json();
                if(!response.ok) throw new Error(response.status === 404 ? '后端尚未加载 Jinni 功能，请重启本地服务后重试。' : (data.detail || '加载 Jinni 失败'));
                jinnis = data.jinnis || [];
                renderJinniQuickList();
                if(jinniWorkspaceMode === 'manager') renderJinniManager();
            } catch(e) {
                if(jinniWorkspaceMode === 'manager') renderJinniManager(e.message || '加载 Jinni 失败');
            }
        }

        async function loadKnowledgeBases(){
            try {
                const response = await fetch('/api/knowledge-bases', {headers:{'X-User-ID':userId}});
                const data = await response.json();
                if(!response.ok) throw new Error(data.detail || '加载知识库失败');
                knowledgeBases = data.knowledge_bases || [];
            } catch(e) { knowledgeBases = []; }
        }

        function renderJinniQuickList(){
            const list = document.getElementById('jinniQuickList');
            if(!list) return;
            list.innerHTML = jinnis.slice(0,4).map(item => `
                <button type="button" class="jinni-quick" onclick="startJinniConversation('${escapeHtml(item.id)}')" title="使用 ${escapeHtml(item.name)} 发起新聊天">
                    ${jinniAvatarMarkup(item,'jinni-quick-avatar')}
                    <span class="jinni-quick-name">${escapeHtml(item.name)}</span>
                </button>`).join('');
            lucide.createIcons();
        }

        function jinniCapabilityTags(item){
            const tags = ['聊天'];
            if(item.capabilities?.generate_image) tags.push('生图');
            if(item.capabilities?.edit_image) tags.push('改图');
            if(item.knowledge_files?.length) tags.push(`${item.knowledge_files.length} 份知识`);
            if(item.knowledge_base_ids?.length) tags.push(`${item.knowledge_base_ids.length} 个知识库`);
            return tags.map(tag => `<span class="jinni-tag">${escapeHtml(tag)}</span>`).join('');
        }

        function renderJinniManager(error=''){
            const workspace = document.getElementById('jinniWorkspace');
            if(!workspace || jinniWorkspaceMode !== 'manager') return;
            const cards = error
                ? `<div class="jinni-empty"><i data-lucide="circle-alert"></i><strong>暂时无法加载 Jinni</strong><span>${escapeHtml(error)}</span></div>`
                : jinnis.length ? jinnis.map(item => `
                    <article class="jinni-card">
                        <div class="jinni-card-head">
                            ${jinniAvatarMarkup(item)}
                            <div class="jinni-card-heading">
                                <div class="jinni-card-name">${escapeHtml(item.name)}</div>
                                <div class="jinni-card-model">${escapeHtml(shortModelName(item.chat_model || '自动选择模型'))}</div>
                            </div>
                            <button type="button" class="jinni-card-menu" onclick="openJinniEditor('${escapeHtml(item.id)}')" title="编辑 Jinni" aria-label="编辑 Jinni"><i data-lucide="pencil"></i></button>
                        </div>
                        <div class="jinni-card-description">${escapeHtml(item.description || '这个 Jinni 还没有简介。')}</div>
                        <div class="jinni-card-tags">${jinniCapabilityTags(item)}</div>
                        <div class="jinni-card-actions">
                            <button type="button" class="primary" onclick="startJinniConversation('${escapeHtml(item.id)}')"><i data-lucide="message-square-plus"></i><span>发起聊天</span></button>
                            <button type="button" onclick="openJinniEditor('${escapeHtml(item.id)}')">编辑</button>
                        </div>
                    </article>`).join('')
                : `<div class="jinni-empty"><i data-lucide="sparkles"></i><strong>创建你的第一个 Jinni</strong><span>为重复任务保存专属指令、知识文件和模型能力，之后随时从这里发起新聊天。</span><button type="button" class="jinni-primary-action" onclick="openJinniEditor()"><i data-lucide="plus"></i><span>新建 Jinni</span></button></div>`;
            workspace.innerHTML = `
                <div class="jinni-hero">
                    <div><div class="jinni-hero-kicker">Personal AI workspace</div><h2>构建你的 Jinni</h2><p>把常用角色、工作方法和知识资料保存成专属智能体。每次从 Jinni 发起聊天时，都会冻结一份独立配置快照。</p></div>
                    <button type="button" class="jinni-primary-action" onclick="openJinniEditor()"><i data-lucide="plus"></i><span>新建 Jinni</span></button>
                </div>
                <div class="jinni-manager">
                    <div class="jinni-manager-toolbar"><h3>我的 Jinni</h3><label class="jinni-search"><i data-lucide="search"></i><input type="search" placeholder="搜索 Jinni" oninput="handleJinniSearch(this.value)"></label></div>
                    <div class="jinni-grid">${cards}</div>
                </div>`;
            lucide.createIcons();
        }

        function handleJinniSearch(value){
            if(jinniSearchTimer) clearTimeout(jinniSearchTimer);
            jinniSearchTimer = setTimeout(() => loadJinnis(String(value || '').trim()), 220);
        }

        function jinniProviderOptions(kind, selected){
            const items = kind === 'image' ? imageProviders() : chatProviders();
            return items.map(item => `<option value="${escapeHtml(item.id)}" ${item.id === selected ? 'selected' : ''}>${escapeHtml(item.name || item.id)}</option>`).join('');
        }

        function jinniModelOptions(kind, providerId, selected){
            const models = uniqueModels(providerById(providerId, kind)?.[kind === 'image' ? 'image_models' : 'chat_models'] || []);
            return models.map(model => `<option value="${escapeHtml(model)}" ${model === selected ? 'selected' : ''}>${escapeHtml(shortModelName(model))}</option>`).join('');
        }

        function normalizedJinniKnowledgeConfig(item={}){
            if(isObject(item.knowledge_config)){
                const config = item.knowledge_config;
                return {
                    default_mode:['none','augment','strict','maintain'].includes(config.default_mode) ? config.default_mode : 'none',
                    augment:{enabled:!!config.augment?.enabled,knowledge_base_ids:[...(config.augment?.knowledge_base_ids||[])]},
                    strict:{enabled:!!config.strict?.enabled,knowledge_base_id:config.strict?.knowledge_base_id||''},
                    maintain:{enabled:!!config.maintain?.enabled,knowledge_base_ids:[...(config.maintain?.knowledge_base_ids||[])]},
                };
            }
            const ids=[...(item.knowledge_base_ids||[])];
            return {
                default_mode:item.default_knowledge_mode||'none',
                augment:{enabled:!!item.knowledge_capabilities?.augment,knowledge_base_ids:ids},
                strict:{enabled:!!item.knowledge_capabilities?.strict,knowledge_base_id:item.strict_knowledge_base_id||''},
                maintain:{enabled:!!item.knowledge_capabilities?.maintain,knowledge_base_ids:ids},
            };
        }

        function renderJinniKnowledgeChoices(name,selected=[],radio=false){
            if(!knowledgeBases.length) return '<div class="thread-empty">还没有知识库。请先在主导航“知识库”中创建并导入资料。</div>';
            const values=Array.isArray(selected)?selected:[selected];
            return knowledgeBases.map(item=>`<label class="jinni-kb-option"><input type="${radio?'radio':'checkbox'}" name="${name}" value="${escapeHtml(item.id)}" ${values.includes(item.id)?'checked':''}><span title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span></label>`).join('');
        }

        function refreshJinniDefaultKnowledgeModes(changedMode=''){
            const select=document.getElementById('jinniDefaultKnowledgeMode');
            if(!select) return;
            const current=select.value||'none';
            const enabled={augment:!!document.getElementById('jinniKbAugment')?.checked,strict:!!document.getElementById('jinniKbStrict')?.checked,maintain:!!document.getElementById('jinniKbMaintain')?.checked};
            const labels={augment:'结合知识库回答',strict:'仅知识库回答',maintain:'知识维护'};
            select.innerHTML=`<option value="none">普通对话（默认不检索知识库）</option>`+Object.keys(labels).filter(mode=>enabled[mode]).map(mode=>`<option value="${mode}">${labels[mode]}</option>`).join('');
            select.value=enabled[current]||current==='none'?current:'none';
            const hint=document.getElementById('jinniKnowledgeHint');
            if(changedMode && !enabled[changedMode] && current===changedMode && hint) hint.textContent='已关闭默认能力，打开 Jinni 时将回到普通对话。';
        }

        function toggleJinniKnowledgeCapability(mode){
            const checkbox=document.getElementById(`jinniKb${mode[0].toUpperCase()}${mode.slice(1)}`);
            const body=document.getElementById(`jinniKb${mode[0].toUpperCase()}${mode.slice(1)}Body`);
            const card=checkbox?.closest('.jinni-knowledge-card');
            if(body) body.hidden=!checkbox?.checked;
            card?.classList.toggle('enabled',!!checkbox?.checked);
            refreshJinniDefaultKnowledgeModes(mode);
        }

        function openJinniEditor(id=''){
            const source = id ? jinnis.find(item => item.id === id) : null;
            const defaultChatProvider = source?.provider_id || chatProviders()[0]?.id || 'comfly';
            const defaultImageProvider = source?.image_provider_id || imageProviders()[0]?.id || defaultChatProvider;
            editingJinni = source ? JSON.parse(JSON.stringify(source)) : {
                name:'', avatar_url:'', description:'', instructions:'', starters:[''],
                provider_id:defaultChatProvider,
                chat_model:chatProviders().find(item => item.id === defaultChatProvider)?.chat_models?.[0] || config.chat_model || '',
                image_provider_id:defaultImageProvider,
                image_model:imageProviders().find(item => item.id === defaultImageProvider)?.image_models?.[0] || config.image_model || '',
                capabilities:{chat:true,generate_image:false,edit_image:false}, knowledge_files:[],
                knowledge_capabilities:{augment:false,strict:false,maintain:false}, knowledge_base_ids:[],
                strict_knowledge_base_id:'', default_knowledge_mode:'none',
                knowledge_config:{default_mode:'none',augment:{enabled:false,knowledge_base_ids:[]},strict:{enabled:false,knowledge_base_id:''},maintain:{enabled:false,knowledge_base_ids:[]}}
            };
            editingKnowledgeFiles = [...(editingJinni.knowledge_files || [])];
            jinniWorkspaceMode = 'editor';
            setChatTitle(id ? `编辑 ${source.name}` : '新建 Jinni');
            updateWorkspaceChrome();
            renderJinniEditor();
            if(window.innerWidth <= 900) toggleConversationSidebar(false);
        }

        function renderJinniEditor(){
            const workspace = document.getElementById('jinniWorkspace');
            if(!workspace || !editingJinni || jinniWorkspaceMode !== 'editor') return;
            const starters = (editingJinni.starters?.length ? editingJinni.starters : ['']).slice(0,6);
            const knowledgeConfig = normalizedJinniKnowledgeConfig(editingJinni);
            workspace.innerHTML = `<div class="jinni-editor">
                <div class="jinni-editor-head"><h2>${editingJinni.id ? '编辑 Jinni' : '新建 Jinni'}</h2><div class="jinni-editor-actions">${editingJinni.id ? '<button type="button" class="jinni-danger-action" onclick="deleteEditingJinni()">删除</button>' : ''}<button type="button" class="jinni-secondary-action" onclick="showJinniManager()">取消</button><button type="button" class="jinni-primary-action" onclick="saveJinni()"><i data-lucide="save"></i><span>保存 Jinni</span></button></div></div>
                <form id="jinniForm" class="jinni-form" onsubmit="event.preventDefault();saveJinni()">
                    <div class="jinni-field wide"><label>头像</label><div class="jinni-avatar-editor">${jinniAvatarMarkup(editingJinni)}<div><input id="jinniAvatarInput" type="file" accept="image/*" hidden onchange="uploadJinniAvatar(this.files)"><button type="button" class="jinni-add-row" onclick="document.getElementById('jinniAvatarInput').click()"><i data-lucide="upload"></i><span>上传头像</span></button><small>支持 PNG、JPG、WebP，使用方形图片效果最佳。</small></div></div></div>
                    <div class="jinni-field"><label for="jinniName">名称</label><input id="jinniName" maxlength="80" required value="${escapeHtml(editingJinni.name || '')}" placeholder="例如：品牌创意导演"></div>
                    <div class="jinni-field"><label for="jinniDescription">简介</label><input id="jinniDescription" maxlength="300" value="${escapeHtml(editingJinni.description || '')}" placeholder="一句话说明它擅长什么"></div>
                    <div class="jinni-field wide"><label for="jinniInstructions">Jinni 指令</label><textarea id="jinniInstructions" maxlength="20000" required placeholder="定义角色、目标、工作方法、输出格式和边界。">${escapeHtml(editingJinni.instructions || '')}</textarea><small>该指令在聊天中锁定；编辑后只对新会话生效。</small></div>
                    <div class="jinni-field wide"><label>对话开场白</label><div id="jinniStarterList" class="jinni-starter-list">${starters.map((value,index) => `<div class="jinni-starter-row"><input maxlength="200" value="${escapeHtml(value)}" placeholder="建议用户可以这样开始"><button type="button" class="jinni-row-remove" onclick="removeJinniStarter(${index})" aria-label="删除开场白"><i data-lucide="x"></i></button></div>`).join('')}</div><button type="button" class="jinni-add-row" onclick="addJinniStarter()"><i data-lucide="plus"></i><span>添加开场白</span></button></div>
                    <div class="jinni-field"><label for="jinniProvider">对话平台</label><select id="jinniProvider" onchange="refreshJinniChatModels()">${jinniProviderOptions('chat',editingJinni.provider_id)}</select></div>
                    <div class="jinni-field"><label for="jinniChatModel">默认对话模型</label><select id="jinniChatModel">${jinniModelOptions('chat',editingJinni.provider_id,editingJinni.chat_model)}</select></div>
                    <div class="jinni-field"><label for="jinniImageProvider">图像平台</label><select id="jinniImageProvider" onchange="refreshJinniImageModels()">${jinniProviderOptions('image',editingJinni.image_provider_id)}</select></div>
                    <div class="jinni-field"><label for="jinniImageModel">默认图像模型</label><select id="jinniImageModel">${jinniModelOptions('image',editingJinni.image_provider_id,editingJinni.image_model)}</select></div>
                    <div class="jinni-field wide"><span class="jinni-section-label">能力</span><div class="jinni-capabilities"><label class="jinni-capability"><input type="checkbox" checked disabled><span>聊天</span></label><label class="jinni-capability"><input id="jinniCanGenerate" type="checkbox" ${editingJinni.capabilities?.generate_image ? 'checked' : ''}><span>生成图片</span></label><label class="jinni-capability"><input id="jinniCanEdit" type="checkbox" ${editingJinni.capabilities?.edit_image ? 'checked' : ''}><span>编辑图片</span></label></div></div>
                    <section class="jinni-knowledge-section">
                        <div class="jinni-knowledge-intro"><strong>知识库使用方式</strong><span>三种能力彼此独立。只为需要的能力选择资料范围，聊天页不能扩大这里授权的知识库。</span></div>
                        <article class="jinni-knowledge-card ${knowledgeConfig.augment.enabled?'enabled':''}"><label class="jinni-knowledge-card-head"><input id="jinniKbAugment" type="checkbox" ${knowledgeConfig.augment.enabled?'checked':''} onchange="toggleJinniKnowledgeCapability('augment')"><span class="jinni-knowledge-card-copy"><strong>结合知识库回答</strong><span>引用所选资料，也允许结合模型通用知识；知识库事实会带引用。</span></span></label><div id="jinniKbAugmentBody" class="jinni-knowledge-card-body" ${knowledgeConfig.augment.enabled?'':'hidden'}><label>可引用的知识库（可多选）</label><div class="jinni-kb-list">${renderJinniKnowledgeChoices('jinniKbAugmentBase',knowledgeConfig.augment.knowledge_base_ids)}</div></div></article>
                        <article class="jinni-knowledge-card ${knowledgeConfig.strict.enabled?'enabled':''}"><label class="jinni-knowledge-card-head"><input id="jinniKbStrict" type="checkbox" ${knowledgeConfig.strict.enabled?'checked':''} onchange="toggleJinniKnowledgeCapability('strict')"><span class="jinni-knowledge-card-copy"><strong>仅知识库回答</strong><span>只能依据一个指定知识库回答；没有可靠证据时明确拒答。</span></span></label><div id="jinniKbStrictBody" class="jinni-knowledge-card-body" ${knowledgeConfig.strict.enabled?'':'hidden'}><label>严格回答知识库（单选）</label><div class="jinni-kb-list">${renderJinniKnowledgeChoices('jinniKbStrictBase',knowledgeConfig.strict.knowledge_base_id,true)}</div></div></article>
                        <article class="jinni-knowledge-card ${knowledgeConfig.maintain.enabled?'enabled':''}"><label class="jinni-knowledge-card-head"><input id="jinniKbMaintain" type="checkbox" ${knowledgeConfig.maintain.enabled?'checked':''} onchange="toggleJinniKnowledgeCapability('maintain')"><span class="jinni-knowledge-card-copy"><strong>知识维护</strong><span>分析重复、冲突和过期风险，只生成可审批建议，不会直接修改资料。</span></span></label><div id="jinniKbMaintainBody" class="jinni-knowledge-card-body" ${knowledgeConfig.maintain.enabled?'':'hidden'}><label>需要维护的知识库（可多选）</label><div class="jinni-kb-list">${renderJinniKnowledgeChoices('jinniKbMaintainBase',knowledgeConfig.maintain.knowledge_base_ids)}</div></div></article>
                        <div class="jinni-knowledge-default"><label for="jinniDefaultKnowledgeMode">打开这个 Jinni 时默认使用</label><select id="jinniDefaultKnowledgeMode"></select><small id="jinniKnowledgeHint">会话中只能切换到上面已启用的能力。</small></div>
                        <details class="jinni-legacy-knowledge"><summary>兼容知识文件（旧版 Jinni）</summary><div class="jinni-legacy-body"><div id="jinniKnowledgeList" class="jinni-knowledge-list">${renderEditingKnowledge()}</div><input id="jinniKnowledgeInput" type="file" multiple hidden accept=".pdf,.txt,.md,.markdown,.json,.csv,.log,.py,.js,.ts,.tsx,.jsx,.html,.css,.xml,.yaml,.yml,.docx,.xlsx" onchange="uploadJinniKnowledge(this.files);this.value='' "><button type="button" class="jinni-add-row" onclick="document.getElementById('jinniKnowledgeInput').click()"><i data-lucide="paperclip"></i><span>添加兼容知识文件</span></button><small>新知识建议统一放入独立知识库；此处仅为历史 Jinni 保留。</small></div></details>
                    </section>
                    <div id="jinniFormError" class="jinni-form-error"></div>
                </form>
            </div>`;
            refreshJinniDefaultKnowledgeModes();
            const defaultSelect=document.getElementById('jinniDefaultKnowledgeMode');
            if(defaultSelect) defaultSelect.value=knowledgeConfig.default_mode;
            lucide.createIcons();
        }

        function renderEditingKnowledge(){
            return editingKnowledgeFiles.length ? editingKnowledgeFiles.map((ref,index) => `<div class="jinni-knowledge-row"><i data-lucide="file-text"></i><span class="jinni-knowledge-name" title="${escapeHtml(attachmentName(ref))}">${escapeHtml(attachmentName(ref))}</span><button type="button" class="jinni-row-remove" onclick="removeJinniKnowledge(${index})" aria-label="删除知识文件"><i data-lucide="x"></i></button></div>`).join('') : '<div class="thread-empty">还没有知识文件</div>';
        }

        function collectJinniDraft(){
            const knowledgeConfig={
                default_mode:document.getElementById('jinniDefaultKnowledgeMode')?.value||'none',
                augment:{enabled:!!document.getElementById('jinniKbAugment')?.checked,knowledge_base_ids:[...document.querySelectorAll('input[name="jinniKbAugmentBase"]:checked')].map(input=>input.value)},
                strict:{enabled:!!document.getElementById('jinniKbStrict')?.checked,knowledge_base_id:document.querySelector('input[name="jinniKbStrictBase"]:checked')?.value||''},
                maintain:{enabled:!!document.getElementById('jinniKbMaintain')?.checked,knowledge_base_ids:[...document.querySelectorAll('input[name="jinniKbMaintainBase"]:checked')].map(input=>input.value)},
            };
            const unionIds=[...new Set([...knowledgeConfig.augment.knowledge_base_ids,knowledgeConfig.strict.knowledge_base_id,...knowledgeConfig.maintain.knowledge_base_ids].filter(Boolean))];
            return {
                name:document.getElementById('jinniName')?.value.trim() || '',
                avatar_url:editingJinni?.avatar_url || '',
                description:document.getElementById('jinniDescription')?.value.trim() || '',
                instructions:document.getElementById('jinniInstructions')?.value.trim() || '',
                starters:[...document.querySelectorAll('#jinniStarterList input')].map(input => input.value.trim()).filter(Boolean).slice(0,6),
                provider_id:document.getElementById('jinniProvider')?.value || '',
                chat_model:document.getElementById('jinniChatModel')?.value || '',
                image_provider_id:document.getElementById('jinniImageProvider')?.value || '',
                image_model:document.getElementById('jinniImageModel')?.value || '',
                capabilities:{chat:true,generate_image:!!document.getElementById('jinniCanGenerate')?.checked,edit_image:!!document.getElementById('jinniCanEdit')?.checked},
                knowledge_files:editingKnowledgeFiles,
                knowledge_config:knowledgeConfig,
                knowledge_capabilities:{augment:knowledgeConfig.augment.enabled,strict:knowledgeConfig.strict.enabled,maintain:knowledgeConfig.maintain.enabled},
                knowledge_base_ids:unionIds,
                strict_knowledge_base_id:knowledgeConfig.strict.knowledge_base_id,
                default_knowledge_mode:knowledgeConfig.default_mode,
            };
        }

        function setJinniFormError(message=''){
            const node = document.getElementById('jinniFormError');
            if(node) node.textContent = message;
        }

        async function saveJinni(){
            const draft = collectJinniDraft();
            if(!draft.name || !draft.instructions){ setJinniFormError('请填写 Jinni 名称和指令。'); return; }
            if(draft.knowledge_config.augment.enabled && !draft.knowledge_config.augment.knowledge_base_ids.length){ setJinniFormError('启用结合知识库回答时，请至少选择一个知识库。'); return; }
            if(draft.knowledge_config.strict.enabled && !draft.knowledge_config.strict.knowledge_base_id){ setJinniFormError('启用仅知识库回答时，请选择一个知识库。'); return; }
            if(draft.knowledge_config.maintain.enabled && !draft.knowledge_config.maintain.knowledge_base_ids.length){ setJinniFormError('启用知识维护时，请至少选择一个知识库。'); return; }
            setJinniFormError('');
            try {
                const id = editingJinni?.id;
                const response = await fetch(id ? `/api/jinnis/${id}` : '/api/jinnis', {method:id ? 'PATCH' : 'POST',headers:headers(),body:JSON.stringify(draft)});
                const data = await response.json();
                if(!response.ok) throw new Error(response.status === 404 ? '后端尚未加载 Jinni 功能，请重启本地服务后重试。' : (data.detail || '保存 Jinni 失败'));
                await loadJinnis();
                showJinniManager();
            } catch(e) { setJinniFormError(e.message || '保存 Jinni 失败'); }
        }

        async function deleteEditingJinni(){
            if(!editingJinni?.id) return;
            const accepted = await showConfirmDialog({
                title:`删除 Jinni「${editingJinni.name}」？`,
                message:'删除后将无法再从管理器使用这个 Jinni，但已有历史会话及其配置快照会继续保留。',
                confirmText:'删除 Jinni',
            });
            if(!accepted) return;
            const response = await fetch(`/api/jinnis/${editingJinni.id}`, {method:'DELETE',headers:{'X-User-ID':userId}});
            const data = await response.json();
            if(!response.ok){ setJinniFormError(data.detail || '删除 Jinni 失败'); return; }
            await Promise.all([loadJinnis(),loadConversations()]);
            showJinniManager();
        }

        function addJinniStarter(){
            const draft = collectJinniDraft();
            if(draft.starters.length >= 6) return;
            editingJinni = {...editingJinni,...draft,starters:[...draft.starters,'']};
            renderJinniEditor();
        }

        function removeJinniStarter(index){
            const values = [...document.querySelectorAll('#jinniStarterList input')].map(input => input.value);
            values.splice(index,1);
            editingJinni = {...editingJinni,...collectJinniDraft(),starters:values.length ? values : ['']};
            renderJinniEditor();
        }

        function removeJinniKnowledge(index){
            editingJinni = {...editingJinni,...collectJinniDraft()};
            editingKnowledgeFiles.splice(index,1);
            renderJinniEditor();
        }

        async function uploadJinniFiles(files, avatar=false){
            if(!files?.length) return [];
            const form = new FormData();
            [...files].forEach(file => form.append('files',file));
            const response = await fetch('/api/ai/upload',{method:'POST',body:form});
            const data = await response.json();
            if(!response.ok) throw new Error(data.detail || '上传失败');
            return data.files || [];
        }

        async function uploadJinniAvatar(files){
            try {
                editingJinni = {...editingJinni,...collectJinniDraft()};
                const uploaded = await uploadJinniFiles([...files].slice(0,1),true);
                if(uploaded[0]) editingJinni.avatar_url = uploaded[0].url;
                renderJinniEditor();
            } catch(e) { setJinniFormError(e.message || '头像上传失败'); }
        }

        async function uploadJinniKnowledge(files){
            const selected = [...(files || [])];
            if(editingKnowledgeFiles.length + selected.length > 20){ setJinniFormError('每个 Jinni 最多保存 20 份知识文件。'); return; }
            const unsupported = selected.find(file => !/\.(pdf|txt|md|markdown|json|csv|log|py|js|ts|tsx|jsx|html|css|xml|ya?ml|docx|xlsx)$/i.test(file.name));
            if(unsupported){ setJinniFormError(`${unsupported.name} 格式不受支持，请先转换格式。`); return; }
            try {
                editingJinni = {...editingJinni,...collectJinniDraft()};

        function isPristineConversation(conversation=currentConversation){
            if(!conversation?.id || (conversation.messages || []).length) return false;
            const run = latestRunForConversation(conversation.id);
            return !run || !['queued','running'].includes(run.status);
        }

        async function discardPristineConversation(){
            if(!isPristineConversation()) return false;
            const id = currentConversation.id;
            const response = await fetch(`/api/conversations/${id}`, {method:'DELETE',headers:{'X-User-ID':userId}});
            if(!response.ok){
                const data = await response.json().catch(() => ({}));
                throw new Error(data.detail || '无法复用当前空白会话');
            }
            conversations = conversations.filter(item => item.id !== id);
            [...runStates.values()].filter(run => run.conversation_id === id).forEach(run => runStates.delete(run.id));
            currentConversation = null;
            rememberConversation('');
            renderThreads();
            return true;
        }

        async function startJinniConversation(id){
            if(conversationTransitioning) return;
            conversationTransitioning = true;
            try {
                const currentSnapshot = currentJinniSnapshot();
                if(isPristineConversation() && currentSnapshot?.id === id){
                    applyConversationRuntimeSettings();
                    showChatWorkspace();
                    setChatTitle(currentConversation.title || currentSnapshot.name);
                    renderMessages([]);
                    if(window.innerWidth <= 900) toggleConversationSidebar(false);
                    return;
                }
                if(isPristineConversation()) await discardPristineConversation();
                const response = await fetch(`/api/jinnis/${id}/conversations`,{method:'POST',headers:{'X-User-ID':userId}});
                const data = await response.json();
                if(!response.ok) throw new Error(data.detail || '无法发起 Jinni 聊天');
                currentConversation = data.conversation;
                rememberConversation(currentConversation.id);
                applyConversationRuntimeSettings();
                showChatWorkspace();
                setChatTitle(currentConversation.title);
                lastRenderedRunSignature = '';
                renderMessages([]);
                await Promise.all([loadConversations(),loadJinnis()]);
                if(window.innerWidth <= 900) toggleConversationSidebar(false);
            } catch(e) { alert(e.message || '无法发起 Jinni 聊天'); }
            finally { conversationTransitioning = false; }
        }

        function validateSavedProviderState(){
            const chatProviderList = chatProviders();
            provider = chatProviderList.some(p => p.id === provider) ? provider : (chatProviderList[0]?.id || 'comfly');
            const chatModels = uniqueModels(providerById(provider, 'chat')?.chat_models || []);
            const rememberedChatModel = chatProviderModels[provider];
            activeChatModel = chatModels.includes(activeChatModel)
                ? activeChatModel
                : (chatModels.includes(rememberedChatModel) ? rememberedChatModel : (chatModels[0] || config.chat_model));
            chatProviderModels[provider] = activeChatModel;
            if(provider === 'modelscope') msModel = activeChatModel;
            if(config.ms_chat_models?.length && msModel && !config.ms_chat_models.includes(msModel)) msModel = config.ms_chat_models[0];
            if(config.ms_chat_models?.length && provider === 'modelscope') activeChatModel = msModel || config.ms_chat_models[0];

            const imageProviderList = imageProviders();
            activeImageProvider = imageProviderList.some(p => p.id === activeImageProvider) ? activeImageProvider : (imageProviderList[0]?.id || 'comfly');
            const imageModels = uniqueModels(providerById(activeImageProvider, 'image')?.image_models || []);
            activeImageModel = imageModels.includes(activeImageModel) ? activeImageModel : (imageModels[0] || config.image_model);

        function positionModelPicker(){
            const btn = document.getElementById('modelPickerBtn');
            const pop = document.getElementById('modelPickerPopover');
            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const width = Math.min(380, Math.max(300, viewportW - 32));
            const estimatedHeight = Math.min(390, Math.max(260, viewportH * .62));
            const availableAbove = Math.max(180, rect.top - 14);
            const maxHeight = Math.min(390, availableAbove, viewportH - 32);
            const left = Math.min(Math.max(16, rect.left), Math.max(16, viewportW - width - 16));
            const top = Math.max(12, rect.top - maxHeight - 10);
            pop.style.setProperty('--model-picker-left', `${Math.round(left)}px`);
            pop.style.setProperty('--model-picker-top', `${Math.round(Math.max(16, top))}px`);
            pop.style.setProperty('--model-picker-width', `${Math.round(width)}px`);
            pop.style.setProperty('--model-picker-max-height', `${Math.round(maxHeight)}px`);
            requestAnimationFrame(() => {
                const box = pop.getBoundingClientRect();
                const nextLeft = box.right > viewportW - 12 ? (left - (box.right - viewportW + 12)) : left;
                const overlap = box.bottom - (rect.top - 8);
                const nextTop = overlap > 0 ? (top - overlap - 2) : top;
                pop.style.setProperty('--model-picker-left', `${Math.round(Math.max(12, nextLeft))}px`);
                pop.style.setProperty('--model-picker-top', `${Math.round(Math.max(12, nextTop))}px`);
            });
        }
        function toggleResolutionPicker(force){

            const pop = document.getElementById('resolutionPickerPopover');
            if(!picker) return;
            const shouldOpen = typeof force === 'boolean' ? force : !picker.classList.contains('open');

                resolutionPickerHome.appendChild(pop);
            }
        }

        function positionResolutionPicker(){
            const btn = document.getElementById('resolutionPickerBtn');
            const pop = document.getElementById('resolutionPickerPopover');
            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const desiredWidth = chatResolution === 'auto' ? 300 : (chatResolution === 'custom' ? 340 : 420);
            const width = Math.min(desiredWidth, Math.max(260, viewportW - 32));
            const safeX = 12;
            const safeTop = 12;
            const safeBottom = 18;
            const gap = 10;
            const left = Math.min(Math.max(safeX, rect.left + rect.width / 2 - width / 2), Math.max(safeX, viewportW - width - safeX));
            const availableAbove = Math.max(96, rect.top - safeTop - gap);
            const initialHeight = Math.min(chatResolution === 'auto' ? 220 : 390, availableAbove, viewportH - safeTop - safeBottom);
            const initialTop = Math.max(safeTop, rect.top - initialHeight - gap);
            pop.style.setProperty('--resolution-picker-left', `${Math.round(left)}px`);
            pop.style.setProperty('--resolution-picker-top', `${Math.round(initialTop)}px`);
            pop.style.setProperty('--resolution-picker-width', `${Math.round(width)}px`);
            pop.style.setProperty('--resolution-picker-max-height', `${Math.round(initialHeight)}px`);
            pop.style.setProperty('--resolution-picker-list-height', '320px');
            requestAnimationFrame(() => {
                const naturalHeight = Math.ceil(pop.scrollHeight || pop.getBoundingClientRect().height || 160);
                const maxHeight = Math.max(96, Math.min(naturalHeight, availableAbove, viewportH - safeTop - safeBottom));
                const headHeight = Math.ceil(pop.querySelector('.resolution-picker-head')?.getBoundingClientRect().height || 50);
                const listHeight = Math.max(58, maxHeight - headHeight - 20);
                const top = Math.max(safeTop, rect.top - maxHeight - gap);
                pop.style.setProperty('--resolution-picker-max-height', `${Math.round(maxHeight)}px`);
                pop.style.setProperty('--resolution-picker-list-height', `${Math.round(listHeight)}px`);
                pop.style.setProperty('--resolution-picker-top', `${Math.round(top)}px`);
                const box = pop.getBoundingClientRect();
                const nextLeft = box.right > viewportW - 12 ? (left - (box.right - viewportW + 12)) : left;
                const overlap = box.bottom - (rect.top - 8);
                const nextTop = overlap > 0 ? (top - overlap - 2) : top;
                pop.style.setProperty('--resolution-picker-left', `${Math.round(Math.max(12, nextLeft))}px`);
                pop.style.setProperty('--resolution-picker-top', `${Math.round(Math.max(12, nextTop))}px`);
            });
        }

        function renderModelPicker(){
