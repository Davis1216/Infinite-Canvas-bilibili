            const picker = document.getElementById('modelPicker');
            const scope = document.getElementById('modelPickerScope');
            const providerList = document.getElementById('modelProviderList');
            const modelList = document.getElementById('modelList');
            const providerLabel = document.getElementById('modelPickerProvider');
            const modelLabel = document.getElementById('modelPickerModel');
            const title = document.getElementById('modelPickerTitle');
            if(!picker || !scope || !providerList || !modelList) return;
            const currentPid = currentProviderId(kind);
            const currentMdl = currentModel(kind);
            providerLabel.textContent = providerNameById(currentPid, kind);
            if(currentJinniSnapshot()) {
                modelLabel.textContent = shortModelName(activeChatModel);
            } else if(mode === 'agent') {
                modelLabel.textContent = `${shortModelName(activeChatModel)} + ${shortModelName(activeImageModel)}`;
            } else {
                modelLabel.textContent = shortModelName(currentMdl);
            }
            title.textContent = currentJinniSnapshot() ? '当前会话模型' : (mode === 'agent' ? '智能助手模型' : (kind === 'image' ? '生图模型' : '对话模型'));
            scope.innerHTML = mode === 'agent' && !currentJinniSnapshot()
                ? `<button class="${kind === 'chat' ? 'active' : ''}" onclick="setModelPickerScope('chat')">对话</button><button class="${kind === 'image' ? 'active' : ''}" onclick="setModelPickerScope('image')">图像</button>`
                : '';
            scope.style.display = mode === 'agent' && !currentJinniSnapshot() ? 'flex' : 'none';
            const providers = kind === 'image' ? imageProviders() : chatProviders();
            providerList.innerHTML = providers.length
                ? providers.map(p => `<button class="model-picker-option ${p.id === currentPid ? 'active' : ''}" onclick="setProvider('${escapeHtml(p.id)}','${kind}')"><span>${escapeHtml(p.name || p.id)}</span>${p.id === currentPid ? '<i data-lucide="check"></i>' : ''}</button>`).join('')
                : `<div class="model-picker-empty">暂无平台</div>`;
            const models = modelListForCurrent(kind);
            modelList.innerHTML = models.length
                ? models.map(m => `<button class="model-picker-option ${m === currentMdl ? 'active' : ''}" onclick="setActiveModel('${escapeHtml(m)}','${kind}');toggleModelPicker(false)"><span>${escapeHtml(shortModelName(m))}</span>${m === currentMdl ? '<i data-lucide="check"></i>' : ''}</button>`).join('')
                : `<div class="model-picker-empty">暂无模型</div>`;
            lucide.createIcons();
        }

        function latestRunForConversation(id){
            return [...runStates.values()]
                .filter(run => run.conversation_id === id)
                .sort((a,b) => Number(b.updated_at || b.created_at || 0) - Number(a.updated_at || a.created_at || 0))[0] || null;
        }

        function runStatusLabel(status){
            return ({queued:'等待中', running:'生成中', failed:'生成失败', cancelled:'已停止', interrupted:'已中断'})[status] || '';
        }

        function runStatusClass(status){
            return ['queued','running','failed','cancelled','interrupted'].includes(status) ? status : '';
        }

        function conversationGroup(item){
            if(item.pinned) return '置顶';
            const timestamp = Number(item.updated_at || item.created_at || 0);
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            if(timestamp >= todayStart) return '今天';
            if(timestamp >= todayStart - 6 * 24 * 60 * 60 * 1000) return '过去 7 天';
            if(timestamp >= todayStart - 29 * 24 * 60 * 60 * 1000) return '过去 30 天';
            return '更早';
        }

        function visibleConversations(){
            return conversations;
        }

        function renderThreads(){
            const list = document.getElementById('threadList');
            if(!list) return;
            list.innerHTML = '';
            const items = visibleConversations();
            if(!items.length){
                list.innerHTML = `<div class="thread-empty">${conversationSearch ? '没有找到匹配的对话' : '还没有对话'}</div>`;
                return;
            }
            const groups = new Map();
            items.forEach(item => {
                const group = conversationGroup(item);
                if(!groups.has(group)) groups.set(group, []);
                groups.get(group).push(item);
            });
            ['置顶','今天','过去 7 天','过去 30 天','更早'].forEach(groupName => {
                const groupItems = groups.get(groupName);
                if(!groupItems?.length) return;
                const section = document.createElement('section');
                section.className = 'thread-group';
                section.innerHTML = `<div class="thread-group-title">${groupName}</div>`;
                groupItems.forEach(item => {
                    const run = latestRunForConversation(item.id);
                    const status = run?.status || item.run_status || '';
                    const row = document.createElement('div');
                    row.className = 'thread-row';
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `thread-item ${currentConversation?.id === item.id ? 'active' : ''}`;
                    btn.onclick = () => openConversation(item.id, true);
                    const jinniBadge = item.jinni ? `<span class="thread-jinni-badge ${item.jinni.deleted ? 'thread-jinni-deleted' : ''}" title="${item.jinni.deleted ? '原 Jinni 已删除，当前会话使用配置快照' : escapeHtml(item.jinni.name)}">${item.jinni.avatar_url ? `<img src="${escapeHtml(item.jinni.avatar_url)}" alt="">` : escapeHtml(String(item.jinni.name || 'J').slice(0,1))}</span>` : '';
                    btn.innerHTML = `<div class="thread-title-line">${status && runStatusClass(status) ? `<span class="thread-status-dot ${runStatusClass(status)}"></span>` : ''}${jinniBadge}<span class="thread-title-text">${escapeHtml(item.title || defaultTitle())}</span></div><div class="thread-preview">${escapeHtml(status && runStatusLabel(status) || item.last_message || (item.jinni ? `使用 ${item.jinni.name}` : '空对话'))}</div>`;
                    const menuButton = document.createElement('button');
                    menuButton.type = 'button';
                    menuButton.className = 'thread-menu-button';
                    menuButton.title = '会话操作';
                    menuButton.setAttribute('aria-label', '会话操作');
                    menuButton.innerHTML = '<i data-lucide="more-horizontal"></i>';
                    menuButton.onclick = event => { event.stopPropagation(); toggleThreadMenu(row); };
                    const menu = document.createElement('div');
                    menu.className = 'thread-menu-popover';
                    menu.innerHTML = `<button type="button" data-action="pin"><i data-lucide="pin"></i><span>${item.pinned ? '取消置顶' : '置顶对话'}</span></button><button type="button" data-action="rename"><i data-lucide="pencil"></i><span>重命名</span></button><button type="button" data-action="delete" class="danger"><i data-lucide="trash-2"></i><span>删除对话</span></button>`;
                    menu.querySelector('[data-action="pin"]').onclick = event => { event.stopPropagation(); togglePinConversation(item); };
                    menu.querySelector('[data-action="rename"]').onclick = event => { event.stopPropagation(); renameConversation(item); };
                    menu.querySelector('[data-action="delete"]').onclick = event => { event.stopPropagation(); deleteConversation(item.id, event); };
                    row.append(btn, menuButton, menu);
                    section.appendChild(row);
                });
                list.appendChild(section);
            });
            lucide.createIcons();
        }

        function toggleThreadMenu(row){
            document.querySelectorAll('.thread-menu-popover.open').forEach(item => { if(item !== row.querySelector('.thread-menu-popover')) item.classList.remove('open'); });
            const menu = row.querySelector('.thread-menu-popover');
            const button = row.querySelector('.thread-menu-button');
            menu?.classList.toggle('open');
            button?.classList.toggle('active', menu?.classList.contains('open'));
        }

        function handleConversationSearch(value){
            conversationSearch = String(value || '');
            renderThreads();
            if(conversationSearchTimer) clearTimeout(conversationSearchTimer);
            conversationSearchTimer = setTimeout(loadConversations, 220);
        }

        async function loadConversations(){
            const data = await fetch(`/api/conversations?q=${encodeURIComponent(conversationSearch)}`, {headers:{'X-User-ID':userId}}).then(r=>r.json());
            conversations = data.conversations || [];
            renderThreads();
            if(!currentConversation) {
                const rememberedId = rememberedConversation();
                const target = (rememberedId && conversations.find(item => item.id === rememberedId)) || conversations[0];
                if(target) await openConversation(target.id);
            }
            if(!currentConversation) renderMessages([]);
        }

        async function loadRuns(){
            const data = await fetch('/api/chat/runs', {headers:{'X-User-ID':userId}}).then(r=>r.json());
            runStates.clear();
            (data.runs || []).forEach(run => runStates.set(run.id, run));
            renderThreads();
            renderCurrentRunState();
            scheduleRunPolling();
        }

        function scheduleRunPolling(){
            if(runPollTimer) clearTimeout(runPollTimer);
            const hasActive = [...runStates.values()].some(run => ['queued','running'].includes(run.status));
            runPollTimer = setTimeout(pollRuns, hasActive ? 500 : 2200);
        }

        async function pollRuns(){
            try {
                const data = await fetch('/api/chat/runs', {headers:{'X-User-ID':userId}}).then(r=>r.json());
                const previous = new Map(runStates);
                runStates.clear();
                (data.runs || []).forEach(run => runStates.set(run.id, run));
                renderThreads();
                const currentRun = currentConversation ? latestRunForConversation(currentConversation.id) : null;
                const oldRun = currentRun ? previous.get(currentRun.id) : null;
                if(currentRun && (!oldRun || oldRun.status !== currentRun.status || oldRun.partial_content !== currentRun.partial_content)) {
                    if(currentRun.status === 'succeeded') await refreshCurrentConversation();
                    else renderCurrentRunState();
                }
            } catch(e) {}
            scheduleRunPolling();
        }

        function renderCurrentRunState(){
            if(!currentConversation) return;
            const run = latestRunForConversation(currentConversation.id);
            const signature = `${run?.id || ''}:${run?.status || ''}:${run?.partial_content || ''}:${currentConversation.messages?.length || 0}`;
            if(signature === lastRenderedRunSignature) return;
            lastRenderedRunSignature = signature;
            const messages = [...(currentConversation.messages || [])];
            if(run && ['queued','running','failed','cancelled','interrupted'].includes(run.status)) {
                const content = run.partial_content || run.error || runStatusLabel(run.status);
                if(content) messages.push({role:'assistant', content, run_status:run.status});
            }
            renderMessages(messages);
            updateComposerState();
        }

        async function refreshCurrentConversation(){
            if(!currentConversation?.id) return;
            const data = await fetch(`/api/conversations/${currentConversation.id}`, {headers:{'X-User-ID':userId}}).then(r=>r.json());
            currentConversation = data.conversation;
            setChatTitle(currentConversation.title);
            lastRenderedRunSignature = '';
            renderCurrentRunState();
            await loadConversations();
        }

        async function newConversation(){
            if(conversationTransitioning) return;
            conversationTransitioning = true;
            try {
                const reuseCurrent = isPristineConversation() && !currentJinniSnapshot();
                if(isPristineConversation() && currentJinniSnapshot()) await discardPristineConversation();
                restoreGlobalChatSettings();
                ordinaryKnowledgeDraft={mode:'none',knowledge_base_ids:[]};
                showChatWorkspace();
                conversationSearch = '';
                const searchInput = document.getElementById('conversationSearch');
                if(searchInput) searchInput.value = '';
                if(reuseCurrent){
                    if(currentConversation?.knowledge_context?.mode && currentConversation.knowledge_context.mode!=='none'){
                        const response=await fetch(`/api/conversations/${currentConversation.id}`,{method:'PATCH',headers:headers(),body:JSON.stringify({knowledge_context:{mode:'none',knowledge_base_ids:[]}})});
                        const data=await response.json();
                        if(response.ok) currentConversation=data.conversation;
                    }
                    setChatTitle(currentConversation.title || '新对话');
                    lastRenderedRunSignature = '';
                    renderMessages([]);
                    renderThreads();
                    if(window.innerWidth <= 900) toggleConversationSidebar(false);
                    return;
                }
                const response = await fetch('/api/conversations', {method:'POST', headers:headers(), body:JSON.stringify({title:'新对话'})});
                const data = await response.json();
                if(!response.ok) throw new Error(data.detail || '无法发起新聊天');
                currentConversation = data.conversation;
                setMode(mode,false);
                updateWorkspaceChrome();
                rememberConversation(currentConversation.id);
                setChatTitle(currentConversation.title);
                lastRenderedRunSignature = '';
                renderMessages([]);
                await loadConversations();
                if(window.innerWidth <= 900) toggleConversationSidebar(false);
            } catch(e) { alert(e.message || '无法发起新聊天'); }
            finally { conversationTransitioning = false; }
        }

        async function openConversation(id, closePanel=false){
            if(currentConversation?.id) conversationScrollPositions.set(currentConversation.id, document.getElementById('messages')?.scrollTop || 0);
            const data = await fetch(`/api/conversations/${id}`, {headers:{'X-User-ID':userId}}).then(r=>r.json());
            currentConversation = data.conversation;
            ordinaryKnowledgeDraft={mode:'none',knowledge_base_ids:[]};
            if(currentJinniSnapshot()) applyConversationRuntimeSettings();
            else restoreGlobalChatSettings();
            showChatWorkspace();
            rememberConversation(currentConversation.id);
            setChatTitle(currentConversation.title);
            lastRenderedRunSignature = '';
            renderThreads();
            renderCurrentRunState();
            requestAnimationFrame(() => { const box = document.getElementById('messages'); if(box) box.scrollTop = conversationScrollPositions.get(id) || box.scrollHeight; });
            if(window.innerWidth <= 900 && closePanel) toggleConversationSidebar(false);
        }

        async function renameConversation(item){
            const next = prompt('请输入新的对话名称', item.title || '新对话');
            if(next === null || !next.trim()) return;
            const data = await fetch(`/api/conversations/${item.id}`, {method:'PATCH', headers:headers(), body:JSON.stringify({title:next.trim()})}).then(r=>r.json());
            if(currentConversation?.id === item.id) { currentConversation = data.conversation; setChatTitle(currentConversation.title); }
            await loadConversations();
        }

        async function togglePinConversation(item){
            await fetch(`/api/conversations/${item.id}`, {method:'PATCH', headers:headers(), body:JSON.stringify({pinned:!item.pinned})});
            await loadConversations();
        }

        async function deleteConversation(id, event){
            event?.stopPropagation();
            const item = conversations.find(conversation => conversation.id === id);
            const accepted = await showConfirmDialog({
                title:'删除这条历史对话？',
                message:`「${item?.title || '新对话'}」将被永久删除，此操作无法撤销。`,
                confirmText:'删除对话',
            });
            if(!accepted) return;
            await fetch(`/api/conversations/${id}`, {method:'DELETE', headers:{'X-User-ID':userId}});
            const deletedCurrent = currentConversation?.id === id;
            [...runStates.values()].filter(run => run.conversation_id === id).forEach(run => runStates.delete(run.id));
            if(deletedCurrent){ currentConversation = null; rememberConversation(''); setChatTitle(''); renderMessages([]); }
            await loadConversations();
            if(deletedCurrent && conversations[0]) await openConversation(conversations[0].id);
        }

        function toggleConversationSidebar(force){
            const shell = document.getElementById('chatShell');
            if(!shell) return;
            if(window.innerWidth <= 900){
                shell.classList.toggle('sidebar-mobile-open', force === true ? true : force === false ? false : !shell.classList.contains('sidebar-mobile-open'));
                return;
            }
            shell.classList.toggle('sidebar-collapsed', force === true ? false : force === false ? true : !shell.classList.contains('sidebar-collapsed'));
        }

        function toggleHistory(force){ toggleConversationSidebar(force); }

        document.addEventListener('click', (event) => {
            const picker = document.getElementById('modelPicker');
            const popover = document.getElementById('modelPickerPopover');
            if(picker?.classList.contains('open') && !picker.contains(event.target) && !popover?.contains(event.target)) toggleModelPicker(false);
            const resolutionPicker = document.getElementById('resolutionPicker');
            const resolutionPopover = document.getElementById('resolutionPickerPopover');
            if(resolutionPicker?.classList.contains('open') && !resolutionPicker.contains(event.target) && !resolutionPopover?.contains(event.target)) toggleResolutionPicker(false);
            const menu = event.target.closest?.('.thread-menu-popover,.thread-menu-button');
            if(!menu) document.querySelectorAll('.thread-menu-popover.open').forEach(item => item.classList.remove('open'));
        });

        function setMode(next, persist = true){
            mode = next;
            if(next === 'chat') modelPickerScope = 'chat';
            if(next === 'image') modelPickerScope = 'image';
            toggleModelPicker(false);
            toggleResolutionPicker(false);
            document.getElementById('chatModeBtn')?.classList.toggle('active', next === 'chat');
            document.getElementById('agentModeBtn')?.classList.toggle('active', next === 'agent');
            document.getElementById('imageModeBtn')?.classList.toggle('active', next === 'image');
            document.getElementById('imageControls')?.classList.toggle('hidden', next === 'chat');
            renderProviderControls();
            updateModelLabel();
            if(persist) saveChatSettings();
        }

        function updateModelLabel(){
            let label = '';
            if (mode === 'image') {
                label = activeImageModel || config.image_model || 'Image';
            } else if (mode === 'agent') {
                const chatLabel = provider === 'modelscope'
                    ? (msModel || (config.ms_chat_models?.[0]) || 'ModelScope').split('/').pop().split(':')[0]
                    : (activeChatModel || config.chat_model || 'Chat');
                const imageLabel = (activeImageModel || config.image_model || 'Image').split('/').pop().split(':')[0];
                label = `智能助手 · ${chatLabel} + ${imageLabel}`;
            } else if (provider === 'modelscope') {
                label = msModel || (config.ms_chat_models?.[0]) || 'ModelScope';
                // Shorten the display label
                label = label.split('/').pop().split(':')[0];
            } else {
                label = activeChatModel || config.chat_model || 'Chat';
            }
            const labelEl = document.getElementById('modelLabel');
            if(labelEl) labelEl.textContent = label;
        }

        function setChatRatio(next, preferredSize = ''){
            chatRatio = next;
            ['square','portrait','portrait43','landscape43','landscape','story','wide'].forEach(item => {
                document.getElementById(`chat-ratio-${item}`)?.classList.toggle('active', item === next);
            });
            if(preferredSize){
                const match = SIZE_OPTIONS[next]?.find(([value]) => value === preferredSize);
                if(match) chatPresetResolution = match[1];
            }
            if(chatResolution !== 'auto' && chatResolution !== 'custom') chatResolution = chatPresetResolution;
            updateChatResolutionUI();
            saveChatSettings();
        }

        function normalizeChatCustomSize(value){
            const match = String(value || '').trim().match(/^([1-9]\d{2,3})\s*[xX×*]\s*([1-9]\d{2,3})$/);
            if(!match) return '';
            const w = Math.round(Number(match[1]));
            const h = Math.round(Number(match[2]));
            if(w < 256 || h < 256 || w > 8192 || h > 8192) return '';
            return `${w}x${h}`;
        }

        function chatSizeForResolution(label = chatResolution){
            if(label === 'auto') return '1024x1024';
            if(label === 'custom') return normalizeChatCustomSize(chatCustomSize) || '1024x1024';
            const options = SIZE_OPTIONS[chatRatio] || SIZE_OPTIONS.square;
            const match = options.find(([, item]) => item === label) || options[0];
            return match[0];
        }

        function setChatResolution(next){
            const normalized = ['auto','1k','2k','4k','custom'].includes(next) ? next : 'auto';
            if(['1k','2k','4k'].includes(normalized)) chatPresetResolution = normalized;
            chatResolution = normalized;
            updateChatResolutionUI();
            saveChatSettings();
        }

        function setResolutionPickerScope(scope){
            if(scope === 'auto') {
                chatResolution = 'auto';
                updateChatResolutionUI();
                saveChatSettings();
            } else if(scope === 'custom') {
                setChatResolution('custom');
            } else {
                chatResolution = chatPresetResolution || '1k';
                if(chatResolution === 'auto') chatResolution = '1k';
                chatPresetResolution = chatResolution;
                updateChatResolutionUI();
                saveChatSettings();
            }
        }

        function selectBuiltInRatio(next){
            setChatRatio(next);
        }

        function selectResolutionPreset(next){
            setChatResolution(next);
        }

        function applyCustomResolution(){
            const width = document.getElementById('customResolutionWidth')?.value || '';
            const height = document.getElementById('customResolutionHeight')?.value || '';
            const hint = document.getElementById('customResolutionHint');
            const normalized = normalizeChatCustomSize(`${width}x${height}`);
            if(!normalized){
                if(hint){ hint.textContent = '请输入 256-8192 之间的有效宽度和高度'; hint.classList.add('error'); }
                return;
            }
            chatCustomSize = normalized;
            if(hint){ hint.textContent = '已应用自定义分辨率'; hint.classList.remove('error'); }
            setResolutionPickerScope('custom');
        }

        function updateChatResolutionUI(){
            const typeEl = document.getElementById('resolutionPickerType');
            const valueEl = document.getElementById('resolutionPickerValue');
            const hint = document.getElementById('customResolutionHint');
            const autoScopeBtn = document.getElementById('resolutionScopeAuto');
            const presetScopeBtn = document.getElementById('resolutionScopePreset');
            const customScopeBtn = document.getElementById('resolutionScopeCustom');
            const autoPane = document.getElementById('resolutionAutoPane');
            const presetPane = document.getElementById('resolutionPresetPane');
            const customPane = document.getElementById('resolutionCustomPane');
            const picker = document.getElementById('resolutionPicker');
            if(!['1k','2k','4k'].includes(chatPresetResolution)) chatPresetResolution = '1k';
            const custom = normalizeChatCustomSize(chatCustomSize) || '1024x1024';
            if(chatCustomSize !== custom) chatCustomSize = custom;
            const currentSize = chatSizeForResolution();
            const ratioLabels = { square:'1:1', portrait:'2:3', portrait43:'3:4', landscape43:'4:3', landscape:'3:2', story:'9:16', wide:'16:9' };
            const ratioLabel = ratioLabels[chatRatio] || '1:1';
            const builtInLabel = `${ratioLabel} · ${chatPresetResolution.toUpperCase()} · ${chatSizeForResolution(chatPresetResolution)}`;
            const isAuto = chatResolution === 'auto';
            const isCustom = chatResolution === 'custom';
            if(typeEl) typeEl.textContent = '尺寸';
            if(valueEl) valueEl.textContent = isAuto ? '自动' : (isCustom ? `自定义 · ${currentSize}` : builtInLabel);
            if(picker){
                picker.classList.toggle('auto-mode', isAuto);
                picker.classList.toggle('custom-mode', isCustom);
            }
            if(autoScopeBtn) autoScopeBtn.classList.toggle('active', isAuto);
            if(presetScopeBtn) presetScopeBtn.classList.toggle('active', !isAuto && !isCustom);
            if(customScopeBtn) customScopeBtn.classList.toggle('active', isCustom);
            if(autoPane) autoPane.classList.toggle('hidden', !isAuto);
            if(presetPane) presetPane.classList.toggle('hidden', isAuto || isCustom);
            if(customPane) customPane.classList.toggle('hidden', !isCustom);
            ['1k','2k','4k'].forEach(label => {
                const btn = document.querySelector(`.resolution-picker-option[data-resolution="${label}"]`);
                const sizeEl = document.getElementById(`resolutionPreset${label}`);
                if(btn) btn.classList.toggle('active', !isAuto && !isCustom && chatPresetResolution === label);
                if(sizeEl) sizeEl.textContent = chatSizeForResolution(label);
            });
            ['square','portrait','portrait43','landscape43','landscape','story','wide'].forEach(label => {
                const btn = document.getElementById(`chat-ratio-${label}`);
                if(btn) btn.classList.toggle('active', !isAuto && !isCustom && chatRatio === label);
            });
            const [w, h] = custom.split('x');
            const widthInput = document.getElementById('customResolutionWidth');
            const heightInput = document.getElementById('customResolutionHeight');
            if(widthInput && widthInput.value !== w) widthInput.value = w;
            if(heightInput && heightInput.value !== h) heightInput.value = h;
            if(hint && !hint.classList.contains('error')) hint.textContent = '输入 256-8192 之间的宽度和高度';
            if(document.getElementById('resolutionPicker')?.classList.contains('open')) {
                requestAnimationFrame(positionResolutionPicker);
            }
            lucide.createIcons();
        }

        function currentChatSize(){
            return chatSizeForResolution();
        }

        function chatSizeFromPrompt(message, fallbackSize = currentChatSize()){
            const text = String(message || '');
            const direct = text.match(/(^|[^\d])([1-9]\d{2,4})\s*[xX×*]\s*([1-9]\d{2,4})(?!\d)/);
            if(direct) {
                const w = Number(direct[2]);
                const h = Number(direct[3]);
                if(w >= 256 && h >= 256) return `${w}x${h}`;
            }
            const normalized = text.replace(/[：﹕∶]/g, ':').replace(/比/g, ':').replace(/[／/]/g, ':');
            const match = normalized.match(/(^|[^\d])(1|2|3|4|9|16)\s*:\s*(1|2|3|4|9|16)(?!\d)/);
            if(!match) return fallbackSize;
            const ratio = `${Number(match[2])}:${Number(match[3])}`;
            const ratioMap = { '1:1':'square', '2:3':'portrait', '3:2':'landscape', '3:4':'portrait43', '4:3':'landscape43', '9:16':'story', '16:9':'wide' };
            const key = ratioMap[ratio];
            if(!key) return fallbackSize;
            const wants4k = /4\s*k|4K|超清|超高分辨率/i.test(text);
            const wants2k = /2\s*k|2K|高清|高分辨率/i.test(text);
            if(chatResolution === 'custom' && !wants4k && !wants2k) return fallbackSize;
            const fallbackEdge = Math.max(...String(fallbackSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            const targetLabel = wants4k ? '4k' : (wants2k ? '2k' : (chatResolution === 'auto' ? '1k' : (fallbackEdge >= 2400 ? '4k' : (fallbackEdge >= 1500 ? '2k' : '1k'))));
            return (SIZE_OPTIONS[key] || SIZE_OPTIONS.square).find(([, label]) => label === targetLabel)?.[0] || fallbackSize;
        }

        function renderMessages(messages){
            const box = document.getElementById('messages');
            box.innerHTML = '';
            if(!messages.length){
                const jinni = currentJinniSnapshot();
                if(jinni){
                    const starters = (jinni.starters || []).map(value => `<button type="button" class="jinni-starter-chip" onclick="sendJinniStarter(decodeURIComponent('${encodeURIComponent(value)}'))">${escapeHtml(value)}</button>`).join('');
                    box.innerHTML = `<div class="jinni-chat-empty">${jinniAvatarMarkup(jinni)}<h2>${escapeHtml(jinni.name || 'Jinni')}</h2><p>${escapeHtml(jinni.description || '告诉我你想完成什么，我会按照保存的 Jinni 指令协助你。')}</p>${starters ? `<div class="jinni-starter-chips">${starters}</div>` : ''}</div>`;
                } else {
                    box.innerHTML = `<div class="empty-state"><i data-lucide="messages-square"></i><div class="empty-state-text">${tr('chat.ready')}</div></div>`;
                }
                lucide.createIcons();
                return;
            }
            messages.forEach(addMessageBubble);
            scrollBottom();
        }

        function sendJinniStarter(value){
            const input = document.getElementById('messageInput');
            if(!input) return;
            input.value = String(value || '');
            autoGrow(input);
            sendMessage();
        }

        function addMessageBubble(msg){
            const box = document.getElementById('messages');
            const row = document.createElement('div');
            row.className = `bubble-row ${msg.role === 'user' ? 'user' : 'assistant'}`;
            const bubble = document.createElement('div');
            bubble.className = `bubble ${msg.role === 'user' ? 'user' : 'assistant'}`;
            if(['queued','running'].includes(msg.run_status)) bubble.classList.add('streaming');
            if(msg.run_status) bubble.classList.add('run-state-message');
            const imageUrls = Array.isArray(msg.image_urls) && msg.image_urls.length ? msg.image_urls : (msg.image_url ? [msg.image_url] : []);
            if(imageUrls.length) bubble.classList.add('image-bubble');
            const text = document.createElement('div');
            text.textContent = msg.type === 'image' ? (msg.agent_reply || tr('chat.generated')) : (msg.content || '');
            text.className = 'bubble-text';
            bubble.appendChild(text);
            if(msg.attachments?.length){
                const thumbs = document.createElement('div');
                thumbs.className = 'thumbs';
                msg.attachments.forEach(ref => {
                    const thumb = renderAttachmentThumb(ref);
                    thumbs.appendChild(thumb);
                });
                bubble.appendChild(thumbs);
            }
            if(imageUrls.length){
                const grid = document.createElement('div');
                grid.className = `generated-grid count-${Math.min(imageUrls.length, 4)}`;
                imageUrls.forEach(url => {
                    const img = document.createElement('img');
                    img.className = 'generated';
                    img.src = url;
                    img.onclick = () => openImagePreview(url);
                    grid.appendChild(img);
                });
                bubble.appendChild(grid);
            }
            // Show model badge for assistant messages
            if(msg.role === 'assistant' && msg.model){
                const badge = document.createElement('div');
                const modelShort = msg.model.split('/').pop().split(':')[0];
                const isMs = msg.model.includes('/') && !msg.model.includes('gpt');
                badge.style.cssText = `margin-top:8px;font-size:9px;font-weight:700;opacity:.45;letter-spacing:.06em;`;
                badge.textContent = modelShort;
                bubble.appendChild(badge);
            }
            row.appendChild(bubble);
            box.appendChild(row);
            lucide.createIcons();
            return {row, bubble, text};
        }

        function openImagePreview(url){
            const modal = document.getElementById('imagePreviewModal');
            const img = document.getElementById('imagePreviewImg');
            if(!modal || !img || !url) return;
            img.src = url;
            modal.classList.add('open');
            lucide.createIcons();
        }

        function closeImagePreview(){
            const modal = document.getElementById('imagePreviewModal');
            const img = document.getElementById('imagePreviewImg');
            modal?.classList.remove('open');
            if(img) img.src = '';
        }

        function isImageRef(ref){
            const kind = String(ref?.kind || '').toLowerCase();
            const mime = String(ref?.mime || '').toLowerCase();
            const url = String(ref?.url || '').toLowerCase();
            return kind === 'image' || mime.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|tiff?)(\?|#|$)/.test(url);
        }

        function attachmentName(ref){
            return ref?.name || (ref?.url || '').split('/').pop() || '附件';
        }

        function renderAttachmentThumb(ref){
            if(isImageRef(ref)){
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = ref.url;
                img.title = attachmentName(ref);
                img.onclick = () => openImagePreview(ref.url);
                return img;
            }
            const node = document.createElement('div');
            node.className = 'thumb file-thumb';
            node.title = attachmentName(ref);
            node.innerHTML = `<i data-lucide="file"></i><span class="thumb-name">${escapeHtml(attachmentName(ref))}</span>`;
            return node;
        }

        function renderRefChip(ref, i){
            if(isImageRef(ref)){
                return `<div class="ref-chip"><img src="${escapeHtml(ref.url)}" title="${escapeHtml(attachmentName(ref))}"><button onclick="removeRef(${i})">×</button></div>`;
            }
            return `<div class="ref-chip file"><i data-lucide="file"></i><span class="ref-file-name" title="${escapeHtml(attachmentName(ref))}">${escapeHtml(attachmentName(ref))}</span><button onclick="removeRef(${i})">×</button></div>`;
        }

        async function uploadFiles(files){
            if(!files?.length) return;
            const available = Math.max(0, CHAT_ATTACHMENT_MAX - refs.length);
            if(!available) return;
            const form = new FormData();
            [...files].slice(0, available).forEach(file => form.append('files', file));
            try {
                const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || '上传失败'); return r.json(); });
                refs.push(...(data.files || []));
                renderRefs();
            } catch(e) {
                alert(e.message || '上传失败');
            }
        }

        function renderRefs(){
            const strip = document.getElementById('refStrip');
            strip.innerHTML = refs.map((ref,i) => renderRefChip(ref, i)).join('');
            lucide.createIcons();
            updateComposerOverflow();
        }

        function removeRef(i){ refs.splice(i,1); renderRefs(); }

        window.addEventListener('paste', e => {
            const files = [...(e.clipboardData?.items || [])].filter(x => x.kind === 'file').map(x => x.getAsFile()).filter(Boolean);
            if(files.length) uploadFiles(files);
        });

        const composerBody = document.getElementById('composerBody');
        composerBody.addEventListener('dragover', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.add('drag-over');
        });
        composerBody.addEventListener('dragleave', e => {
            if(!composerBody.contains(e.relatedTarget)) composerBody.classList.remove('drag-over');
        });
        composerBody.addEventListener('drop', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.remove('drag-over');
            const files = [...(e.dataTransfer?.files || [])];
            uploadFiles(files);
        });

        function hasUploadFiles(items){ return [...(items || [])].some(item => item.kind === 'file'); }
        function updateComposerOverflow(){
            const body = document.getElementById('composerBody');
            if(!body) return;
            body.classList.toggle('has-overflow', body.scrollHeight > body.clientHeight + 2);
        }
        function autoGrow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 150) + 'px'; updateComposerOverflow(); }
        function handleKey(e){ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if(!activeRunForCurrentConversation()) sendMessage(); } }
        window.addEventListener('keydown', e => {
            if(e.key === 'Escape' && confirmDialogResolver){
                e.preventDefault();
                resolveConfirmDialog(false);
                return;
            }
            if(e.key === 'Escape' && !document.getElementById('knowledgePickerModal')?.hidden){
                e.preventDefault();
                closeOrdinaryKnowledgePicker();
                return;
            }
            if(e.key === 'Escape') closeImagePreview();
        });

        function activeRunForCurrentConversation(){
            const run = currentConversation ? latestRunForConversation(currentConversation.id) : null;
            return run && ['queued','running'].includes(run.status) ? run : null;
        }

        function updateComposerState(){
            const btn = document.getElementById('sendBtn');
            if(!btn) return;
            const active = activeRunForCurrentConversation();
            btn.classList.toggle('stop', !!active);
            btn.title = active ? '停止生成' : '发送';
            btn.setAttribute('aria-label', active ? '停止生成' : '发送');
            btn.innerHTML = active ? '<i data-lucide="square"></i>' : '<i data-lucide="send"></i>';
            lucide.createIcons();
        }

        async function cancelCurrentRun(){
            const run = activeRunForCurrentConversation();
            if(!run) return;
            const data = await fetch(`/api/chat/runs/${run.id}/cancel`, {method:'POST', headers:headers()}).then(r=>r.json());
            runStates.set(data.run.id, data.run);
            renderThreads();
            lastRenderedRunSignature = '';
            renderCurrentRunState();
        }

        function chatRunPayload(message, pendingRefs, requestedSize, clientRequestId){
            const currentProvider = provider;
            const currentMsModel = currentProvider === 'modelscope' ? (msModel || activeChatModel || (config.ms_chat_models?.[0] || '')) : '';
            const payload = {
                conversation_id: currentConversation?.id || '',
                client_request_id: clientRequestId,
                message,
                system_prompt: currentSystemPrompt(),
                mode,
                size: requestedSize,
                model: currentProvider === 'modelscope' ? currentMsModel : (activeChatModel || config.chat_model),
                ms_model: currentProvider === 'modelscope' ? currentMsModel : '',
                image_model: activeImageModel || config.image_model,
                image_provider: activeImageProvider,
                reference_images: pendingRefs,
                provider: mode === 'image' ? activeImageProvider : currentProvider,
            };
            if(!currentConversation?.id && ordinaryKnowledgeDraft?.mode!=='none') payload.knowledge_context=ordinaryKnowledgeDraft;
            return payload;
        }

        async function sendMessage(){
            if(activeRunForCurrentConversation()) {
                await cancelCurrentRun();
                return;
            }
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if(!message) return;
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            const requestedSize = chatSizeFromPrompt(message);
            const pendingRefs = refs.slice();
            refs = [];
            renderRefs();
            input.value = '';
            autoGrow(input);
            const clientRequestId = uuid();
            const previousConversation = currentConversation ? {...currentConversation, messages:[...(currentConversation.messages || [])]} : null;
            try {
                const response = await fetch('/api/chat/runs', {method:'POST', headers:headers(), body:JSON.stringify(chatRunPayload(message, pendingRefs, requestedSize, clientRequestId))});
                const data = await response.json();
                if(!response.ok) throw new Error(data.detail || tr('chat.requestFailed'));
                const serverMessages = data.conversation?.messages || previousConversation?.messages || [];
                currentConversation = data.conversation;
                ordinaryKnowledgeDraft={mode:'none',knowledge_base_ids:[]};
                currentConversation.messages = [...serverMessages, {id:`pending-${clientRequestId}`, role:'user', content:message, attachments:pendingRefs, created_at:Date.now(), mode}];
                runStates.set(data.run.id, data.run);
                rememberConversation(currentConversation.id);
                setChatTitle(currentConversation.title);
                lastRenderedRunSignature = '';
                renderThreads();
                renderCurrentRunState();
                await loadConversations();
                scheduleRunPolling();
            } catch(err) {
                input.value = message;
                refs = [...pendingRefs, ...refs];
                renderRefs();
                if(previousConversation) currentConversation = previousConversation;
                renderMessages([...(currentConversation?.messages || []), {role:'assistant', content:err.message || tr('chat.requestFailed')}]);
            } finally {
                btn.disabled = false;
                updateComposerState();
                scrollBottom();
            }
        }

        function scrollBottom(){ requestAnimationFrame(() => { const box = document.getElementById('messages'); box.scrollTop = box.scrollHeight; }); }
        function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        window.onload = async () => {
            applyLanguage();
            syncSystemPromptUI();
            setChatRatio(chatRatio);
            setChatResolution(chatResolution);
            await loadConfig();
            await Promise.all([loadJinnis(), loadKnowledgeBases()]);
            await loadRuns();
            await loadConversations();
            updateKnowledgeModeControl();
            updateComposerState();
            updateComposerOverflow();
        };
    </script>
</body>
</html>
