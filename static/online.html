<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>在线生图</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.07.4.2.1783154122"></script>
    <script src="/static/vendor/js/lucide.js?v=2026.07.4.2.1783154122"></script>
    <script src="/static/js/theme.js?v=2026.07.4.2.1783154122"></script>
    <script src="/static/js/i18n.js?v=2026.07.4.2.1784104411"></script>
    <script src="/static/js/image-preview.js?v=2026.07.4.2.1783154122"></script>
    <script src="/static/js/history-bulk-manager.js?v=2026.07.4.2.1783154122"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.07.4.2.1783154122');
        :root { --accent:#111827; --bg:#f9fafb; --card:#fff; --easing:cubic-bezier(0.4,0,0.2,1); }
        body { background:var(--bg); font-family:'Inter',-apple-system,sans-serif; color:var(--accent); -webkit-font-smoothing:antialiased; }
        .container-box { max-width:1280px; margin:0 auto; padding:0 40px; margin-top:50px; }
        .nano-input { background:var(--card); border:1px solid #eef0f2; transition:all .3s var(--easing); }
        .nano-input:focus { border-color:#000; box-shadow:0 0 0 1px #000; }
        .upload-item { background:var(--card); border:1px dashed #e2e8f0; transition:all .4s var(--easing); position:relative; overflow:hidden; }
        .upload-item:hover,.upload-item.drag-over { border-color:#000; transform:translateY(-2px); }
        .preview-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation:fadeIn .5s var(--easing); }
        .glass-btn { background:#111827; transition:all .3s var(--easing); }
        .glass-btn:hover { background:#000; transform:translateY(-1px); box-shadow:0 12px 24px rgba(0,0,0,.1); }
        .result-frame { background:#fff; border-radius:32px; border:1px solid #f1f5f9; box-shadow:0 2px 15px rgba(0,0,0,.02); }
        .tool-panel { background:#fff; border:1px solid #edf0f3; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .model-pill { background:#f8fafc; border:1px solid #edf2f7; border-radius:999px; padding:3px; display:grid; grid-template-columns:1fr 1fr; gap:2px; }
        .model-option { border-radius:999px; height:34px; display:flex; align-items:center; justify-content:center; gap:6px; color:#64748b; font-size:10px; font-weight:600; letter-spacing:.02em; transition:all .25s var(--easing); }
        .model-option.active { background:#fff; color:#111827; box-shadow:0 1px 3px rgba(15,23,42,.08); }
        .control-panel { background:#fff; border:1px solid #edf0f3; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .control-label { display:flex; align-items:center; gap:6px; color:#94a3b8; font-size:10px; font-weight:600; letter-spacing:.04em; }
        .size-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; align-items:start; }
        .size-field { min-width:0; display:flex; flex-direction:column; gap:6px; }
        .size-select,.size-custom { width:100%; min-width:0; max-width:100%; height:34px; border:1px solid #edf2f7; border-radius:14px; background:#f8fafc; color:#111827; outline:none; padding:0 10px; font-size:11px; font-weight:700; }
        .size-select { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .size-select:disabled { opacity:.55; cursor:not-allowed; }
        .size-custom { display:none; background:#fff; }
        .size-field.custom .size-custom { display:block; }
        .size-pair { display:none; grid-template-columns:1fr 1fr; gap:6px; }
        .size-field.custom .size-pair { display:grid; }
        .size-pair .size-custom { display:block; }
        .size-pair.with-fit { grid-template-columns:1fr 1fr auto; align-items:center; }
        .size-fit-btn { height:34px; border:1px solid #edf2f7; border-radius:14px; background:#fff; color:#111827; padding:0 10px; font-size:10px; font-weight:800; white-space:nowrap; }
        .size-fit-btn:disabled { opacity:.45; cursor:not-allowed; }
        .mode-badge { font-size:9px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#0f172a; background:#eef2ff; border:1px solid #e0e7ff; padding:2px 8px; border-radius:999px; }
        .temperature-row { grid-column:1 / -1; display:flex; align-items:center; gap:10px; min-width:0; padding:0 2px; }
        .temperature-row input[type=range] { flex:1; min-width:0; accent-color:#111827; }
        .temperature-value { width:44px; height:28px; border:1px solid #edf2f7; border-radius:10px; background:#f8fafc; color:#111827; text-align:center; font-size:11px; font-weight:800; outline:none; }
        .masonry-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
        @media (min-width:768px){ .masonry-grid{ grid-template-columns:repeat(4,1fr); } }
        @media (max-width:640px){ .size-row{ grid-template-columns:1fr; } }
        .masonry-item { aspect-ratio:1/1; border-radius:24px; overflow:hidden; background:#fff; border:1px solid #f1f5f9; transition:all .5s var(--easing); }
        .masonry-item:hover { transform:translateY(-6px); box-shadow:0 20px 40px rgba(0,0,0,.08); }
        .gallery-lightbox { background:rgba(255,255,255,.99); backdrop-filter:blur(22px) saturate(1.05); }
        .prompt-library-btn { height:28px; padding:0 10px; border:1px solid #e5e7eb; border-radius:999px; background:#fff; color:#64748b; display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; transition:all .2s var(--easing); }
        .prompt-library-btn:hover { color:#111827; border-color:#111827; transform:translateY(-1px); }
        .prompt-modal { background:rgba(15,23,42,.28); backdrop-filter:blur(16px); }
        .prompt-panel { width:min(980px,calc(100vw - 32px)); max-height:min(760px,calc(100vh - 48px)); background:#fff; border:1px solid #edf2f7; border-radius:28px; box-shadow:0 28px 80px rgba(15,23,42,.18); display:flex; flex-direction:column; overflow:hidden; }
        .prompt-panel-head { padding:18px; border-bottom:1px solid #eef2f7; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
        .prompt-panel-head h3 { margin:0; font-size:18px; font-weight:950; letter-spacing:-.04em; }
        .prompt-panel-head p { margin:4px 0 0; color:#94a3b8; font-size:11px; font-weight:800; }
        .prompt-picker-body { min-height:0; display:grid; grid-template-columns:220px minmax(0,1fr); gap:0; }
        .prompt-picker-side { padding:14px; border-right:1px solid #eef2f7; background:#f8fafc; overflow:auto; }
        .prompt-picker-main { padding:14px; min-width:0; overflow:auto; }
        .prompt-picker-search { width:100%; height:38px; border:1px solid #e2e8f0; border-radius:14px; padding:0 12px; outline:none; font-size:12px; font-weight:800; background:#fff; }
        .prompt-picker-search:focus { border-color:#111827; box-shadow:0 0 0 1px #111827; }
        .prompt-lib-list,.prompt-cat-list { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
        .prompt-lib-item,.prompt-cat-item { min-height:34px; border:1px solid transparent; border-radius:12px; padding:0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; color:#64748b; font-size:11px; font-weight:850; text-align:left; }
        .prompt-lib-item.active,.prompt-cat-item.active { background:#fff; border-color:#e2e8f0; color:#111827; box-shadow:0 1px 2px rgba(15,23,42,.04); }
        .prompt-lib-item small,.prompt-cat-item small { min-width:22px; height:20px; border-radius:999px; background:#e2e8f0; color:#64748b; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:950; }
        .prompt-item-list { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
        .prompt-item-card { border:1px solid #e2e8f0; border-radius:16px; padding:12px; background:#fff; transition:all .18s var(--easing); }
        .prompt-item-card:hover { border-color:#111827; box-shadow:0 8px 24px rgba(15,23,42,.06); }
        .prompt-item-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
        .prompt-item-title { min-width:0; font-size:13px; font-weight:950; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .prompt-item-tag { flex:0 0 auto; border-radius:999px; background:#eef2ff; color:#475569; padding:2px 8px; font-size:10px; font-weight:900; }
        .prompt-item-text { color:#334155; font-size:12px; line-height:1.55; max-height:58px; overflow:hidden; }
        .prompt-item-actions { margin-top:10px; display:flex; gap:8px; justify-content:flex-end; }
        .prompt-action-btn { height:30px; border:1px solid #e2e8f0; border-radius:10px; padding:0 10px; font-size:10px; font-weight:950; color:#475569; background:#f8fafc; }
        .prompt-action-btn.primary { background:#111827; color:#fff; border-color:#111827; }
        .prompt-picker-empty { min-height:180px; border:1px dashed #cbd5e1; border-radius:16px; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:12px; font-weight:850; }
        @media (max-width:720px){ .prompt-picker-body{ grid-template-columns:1fr; } .prompt-picker-side{ border-right:0; border-bottom:1px solid #eef2f7; max-height:260px; } }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    </style>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.07.4.2.1783154122">
    <style>
        html:not(.studio-theme-dark) body:not(.studio-theme-dark) #lightbox.gallery-lightbox {
            background: rgba(255,255,255,.99) !important;
            backdrop-filter: blur(22px) saturate(1.05) !important;
            -webkit-backdrop-filter: blur(22px) saturate(1.05) !important;
        }
    </style>
</head>
<body>
    <div class="container-box min-h-screen flex flex-col">
        <header class="flex justify-between items-end mb-16">
            <div class="space-y-1">
                <h1 class="text-4xl font-extrabold tracking-tighter italic" data-i18n="online.title">在线生图</h1>
                <p class="text-[10px] font-bold uppercase tracking-[0.4em] text-gray-400">GPT / NANO BANANA IMAGE STUDIO</p>
            </div>
            <nav class="hidden md:flex gap-8 text-[11px] font-bold uppercase tracking-widest text-gray-400">
                <span class="text-black border-b-2 border-black pb-1" data-i18n="online.create">Create</span>
            </nav>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <div class="lg:col-span-5 space-y-8">
                <section class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest">Prompt</span>
                        <button id="openPromptLibraryBtn" class="prompt-library-btn ml-auto" type="button" onclick="openPromptLibraryPicker()">
                            <i data-lucide="library" class="w-3.5 h-3.5"></i>
                            <span>提示词库</span>
                        </button>
                    </div>
                    <textarea id="promptInput" rows="5" class="nano-input w-full p-6 rounded-3xl text-sm outline-none resize-none placeholder-gray-300" placeholder="输入想生成或编辑的画面..." data-i18n-placeholder="online.promptPlaceholder"></textarea>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="images" class="w-3.5 h-3.5"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest" data-i18n="online.referenceImages">Reference Images</span>
                    </div>
                    <div id="referenceGrid" class="grid grid-cols-3 gap-4"></div>
                </section>

                <div class="tool-panel">
                    <div class="control-label">
                        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.model">Model</span>
                        <span id="providerModeBadge" class="mode-badge" style="margin-left:auto;display:none;"></span>
                    </div>
                    <div class="size-row">
                        <label class="size-field">
                            <select id="providerSelect" class="size-select" onchange="setProvider(this.value)"></select>
                        </label>
                        <label class="size-field">
                            <select id="modelSelect" class="size-select" onchange="setModel(this.value)"></select>
                        </label>
                    </div>
                    <div id="adaptiveExtras" class="size-row" style="margin-top:2px;">
                        <label id="qualityField" class="size-field">
                            <select id="qualitySelect" class="size-select" onchange="setQuality(this.value)" title="Quality">
                                <option value="auto" data-i18n="online.qualityAuto">自动</option>
                                <option value="low" data-i18n="online.qualityLow">低</option>
                                <option value="medium" data-i18n="online.qualityMedium">中</option>
                                <option value="high" data-i18n="online.qualityHigh">高</option>
                            </select>
                        </label>
                        <label id="countField" class="size-field">
                            <select id="countSelect" class="size-select" onchange="setCount(this.value)" title="Count">
                                <option value="1" selected>×1</option>
                                <option value="2">×2</option>
                                <option value="3">×3</option>
                                <option value="4">×4</option>
                            </select>
                        </label>
                        <label id="temperatureField" class="temperature-row">
                            <span class="control-label" style="margin:0;flex:0 0 auto;"><i data-lucide="thermometer" class="w-3.5 h-3.5"></i><span>温度</span></span>
                            <input id="temperatureRange" type="range" min="0" max="2" step="0.1" value="0.7" oninput="setTemperature(this.value)">
                            <input id="temperatureInput" class="temperature-value" type="number" min="0" max="2" step="0.1" value="0.7" oninput="setTemperature(this.value)">
                        </label>
                    </div>
                    <div class="control-label mt-1">
                        <i data-lucide="ruler" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.size">Size</span>
                    </div>
                    <div class="size-row">
                        <label id="resolutionField" class="size-field">
                            <select id="resolutionSelect" class="size-select" onchange="setResolution(this.value)">
                                <option value="1k" selected>1K</option>
                                <option value="2k">2K</option>
                                <option value="4k">4K</option>
                                <option value="custom" data-i18n="online.customSize">自定义尺寸</option>
                            </select>
                            <span class="size-pair with-fit">
                                <input id="sizeCustomWidth" class="size-custom" type="number" min="64" step="64" placeholder="宽度" data-i18n-placeholder="online.width" oninput="setCustomSize()">
                                <input id="sizeCustomHeight" class="size-custom" type="number" min="64" step="64" placeholder="高度" data-i18n-placeholder="online.height" oninput="setCustomSize()">
                                <button id="fitImageSizeBtn" class="size-fit-btn" type="button" onclick="fitCustomSizeToImage(event)">适配图片</button>
                            </span>
                        </label>
                        <label id="ratioField" class="size-field">
                            <select id="ratioSelect" class="size-select" onchange="setRatio(this.value)">
                                <option value="" data-i18n="online.emptyRatio">比例为空</option>
                                <option value="square" selected data-i18n="online.square">1:1 方图</option>
                                <option value="portrait" data-i18n="online.portrait">2:3 竖图</option>
                                <option value="landscape" data-i18n="online.landscape">3:2 横图</option>
                                <option value="portrait43">3:4 竖图</option>
                                <option value="landscape43">4:3 横图</option>
                                <option value="story" data-i18n="online.story">9:16 竖屏</option>
                                <option value="wide" data-i18n="online.wide">16:9 宽屏</option>
                                <option value="custom" data-i18n="online.customRatio">自定义比例</option>
                            </select>
                            <span class="size-pair">
                                <input id="ratioCustomWidth" class="size-custom" type="number" min="1" step="1" placeholder="宽" data-i18n-placeholder="online.ratioWidth" oninput="setCustomRatio()">
                                <input id="ratioCustomHeight" class="size-custom" type="number" min="1" step="1" placeholder="高" data-i18n-placeholder="online.ratioHeight" oninput="setCustomRatio()">
                            </span>
                        </label>
                    </div>
                </div>

                <button id="genBtn" onclick="submitImage()" class="glass-btn w-full py-5 text-white rounded-3xl font-bold flex items-center justify-center gap-3 shadow-lg">
                    <i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i>
                    <span class="tracking-[0.3em] text-[11px] uppercase" data-i18n="online.generate">Generate</span>
                </button>
            </div>

            <div class="lg:col-span-7">
                <div id="resultBox" class="result-frame min-h-[500px] lg:h-full flex items-center justify-center relative overflow-hidden">
                    <div id="placeholder" class="text-center space-y-4 opacity-20"><i data-lucide="layout" class="w-12 h-12 mx-auto stroke-[1px]"></i><p class="text-[10px] font-black tracking-[0.5em] uppercase" data-i18n="online.canvasReady">Canvas Ready</p></div>
                    <div id="loader" class="hidden text-center space-y-4"><div class="w-8 h-8 border-2 border-black border-t-transparent rounded-full animate-spin mx-auto"></div><p class="text-[10px] font-black tracking-[0.5em] uppercase" data-i18n="online.generating">Generating</p></div>
                    <img id="outputImg" class="hidden w-full h-full object-contain p-8 cursor-zoom-in" onclick="zoomImage()">
                    <a id="downloadBtn" href="#" download class="hidden absolute top-8 right-8 w-12 h-12 bg-white/90 shadow-2xl rounded-2xl flex items-center justify-center hover:bg-black hover:text-white"><i data-lucide="download" class="w-4 h-4"></i></a>
                </div>
            </div>
        </main>

        <section class="mt-32">
            <div class="flex items-center gap-6 mb-12"><h2 class="text-[11px] font-black uppercase tracking-[0.5em]" data-i18n="online.archives">Archives</h2><div class="h-px flex-1 bg-gray-100"></div></div>
            <div id="masonry" class="masonry-grid"></div>
            <div id="loadMoreTrigger" class="py-20 text-center text-gray-300 text-[10px] font-bold uppercase tracking-widest cursor-pointer hover:text-black">Load More Archive</div>
        </section>
    </div>

    <div id="lightbox" onclick="handleOutsideClick(event)" class="hidden fixed inset-0 z-50 gallery-lightbox flex flex-col items-center justify-center p-8">
        <button onclick="closeLightbox()" class="absolute top-10 right-10 text-gray-400 hover:text-black"><i data-lucide="x" class="w-8 h-8"></i></button>
        <div class="w-full flex flex-col items-center pointer-events-none" style="max-width:min(1280px, 92vw)">
            <div id="lightboxFrame" class="studio-preview-frame pointer-events-auto">
                <img id="lightboxImg" class="studio-preview-img" alt="preview">
                <div data-no-pan class="absolute top-6 left-6 bg-black/50 backdrop-blur-md text-white px-3 py-1.5 rounded-xl text-[10px] font-black tracking-widest shadow-2xl pointer-events-auto z-10">
                    <span id="lightboxRes">0x0</span>
                </div>
                <button id="lightboxDownload" onclick="downloadLightboxImage(event)" data-no-pan class="absolute top-6 right-6 bg-black text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-2xl hover:scale-105 transition-transform pointer-events-auto z-10">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="lightboxCard" class="w-full mt-16 pointer-events-auto bg-white border border-gray-100 rounded-[2rem] p-8 shadow-sm flex justify-between items-center gap-8">
                <div class="flex-1">
                    <span class="text-[9px] font-black text-gray-300 uppercase tracking-widest block mb-2">Prompt</span>
                    <p id="lightboxPrompt" class="text-gray-700 text-sm leading-relaxed max-h-32 overflow-y-auto pr-2"></p>
                </div>
                <div class="flex items-center gap-3 flex-wrap justify-end">
                    <button id="addInspirationBtn" onclick="openInspirationPicker('online')" class="bg-white text-black border border-gray-200 px-6 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2 hover:border-black"><i data-lucide="sparkles" class="w-4 h-4"></i><span>加入灵感空间</span></button>
                    <button id="sameStyleBtn" onclick="applySameStyle()" class="bg-black text-white px-8 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><i data-lucide="copy" class="w-4 h-4"></i><span data-i18n="online.reuse">Reuse</span></button>
                </div>
            </div>
        </div>
    </div>

    <div id="inspirationPickerModal" class="hidden fixed inset-0 z-[70] prompt-modal items-center justify-center p-4" onclick="handleInspirationOutside(event)">
        <div class="prompt-panel max-w-[560px]" onclick="event.stopPropagation()">
            <header class="prompt-panel-head">
                <div>
                    <h3>加入灵感空间</h3>
                    <p>保存图片副本，并记录当前提示词与模型参数</p>
                </div>
                <button class="w-10 h-10 rounded-2xl border border-slate-200 flex items-center justify-center text-slate-500 hover:text-black hover:border-black" type="button" onclick="closeInspirationPicker()" title="关闭">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </header>
            <div class="p-6 grid gap-4">
                <label class="grid gap-2 text-[11px] font-black text-slate-500">
                    <span>分类</span>
                    <select id="inspirationCategorySelect" class="h-11 rounded-2xl border border-slate-200 px-4 bg-white text-slate-900 font-bold"></select>
                </label>
                <label class="grid gap-2 text-[11px] font-black text-slate-500">
                    <span>标题</span>
                    <input id="inspirationTitleInput" class="h-11 rounded-2xl border border-slate-200 px-4 bg-white text-slate-900 font-bold" type="text" maxlength="100" placeholder="灵感图像">
                </label>
                <label class="grid gap-2 text-[11px] font-black text-slate-500">
                    <span>标签</span>
                    <input id="inspirationTagsInput" class="h-11 rounded-2xl border border-slate-200 px-4 bg-white text-slate-900 font-bold" type="text" placeholder="用逗号分隔">
                </label>
                <label class="grid gap-2 text-[11px] font-black text-slate-500">
                    <span>备注</span>
                    <textarea id="inspirationNotesInput" class="min-h-[92px] rounded-2xl border border-slate-200 p-4 bg-white text-slate-900 font-medium resize-y" placeholder="记录这个画面的用途、优点或修改方向"></textarea>
                </label>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeInspirationPicker()" class="px-5 h-11 rounded-2xl border border-slate-200 text-[11px] font-black text-slate-500">取消</button>
                    <button id="saveInspirationBtn" type="button" onclick="saveOnlineInspiration()" class="px-6 h-11 rounded-2xl bg-black text-white text-[11px] font-black flex items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i><span>保存</span></button>
                </div>
            </div>
        </div>
    </div>

    <div id="promptLibraryModal" class="hidden fixed inset-0 z-[60] prompt-modal items-center justify-center p-4" onclick="handlePromptLibraryOutside(event)">
        <div class="prompt-panel" onclick="event.stopPropagation()">
            <header class="prompt-panel-head">
                <div>
                    <h3>选择提示词</h3>
                    <p>从素材库的提示词库插入到在线生图 Prompt</p>
                </div>
                <button class="w-10 h-10 rounded-2xl border border-slate-200 flex items-center justify-center text-slate-500 hover:text-black hover:border-black" type="button" onclick="closePromptLibraryPicker()" title="关闭">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </header>
            <div class="prompt-picker-body">
                <aside class="prompt-picker-side">
                    <input id="promptLibrarySearch" class="prompt-picker-search" type="search" placeholder="搜索提示词">
                    <div id="promptLibraryList" class="prompt-lib-list"></div>
                    <div id="promptCategoryList" class="prompt-cat-list"></div>
                </aside>
                <main class="prompt-picker-main">
                    <div id="promptItemList" class="prompt-item-list"></div>
                </main>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('online.title');
            const loader = document.getElementById('loadMoreTrigger');
            if(loader && !isLoading) loader.innerText = tr('online.loadMore');
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
            // API 设置页通过 postMessage 通知平台/模型变更（iframe 内嵌场景）
            if(event.data?.type === 'providers-changed' || event.data?.type === 'workflows-changed') scheduleProviderRefresh();
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('online.title');
            updateAdaptivePanel();
        });
        const REF_SLOT_COUNT = 6;
        const REF_SLOT_LABELS = ['Main','Aux A','Aux B','Aux C','Aux D','Aux E'];
        let refs = {};
        let refDims = {};
        let provider = 'comfly';
        let selectedModel = 'gpt-image-2';
        let apiProviders = [];
        let ratio = 'square';
        let resolution = '1k';
        let customRatioWidth = '';
        let customRatioHeight = '';
        let customWidth = '';
        let customHeight = '';
        let quality = 'auto';
        let temperature = 0.7;
        let outputCount = 1;
        let models = {gpt:'gpt-image-2', nano:'nano-banana-pro'};
        let allHistory = [], currentIndex = 0, currentResult = null, currentLightboxData = null, isLoading = false;
        let promptLibraries = [];
        let promptLibraryLoadedAt = 0;
        let activePromptLibraryId = '';
        let activePromptCategory = 'all';
        let promptLibraryQuery = '';
        const PAGE_SIZE = 24;
        const SIZE_OPTIONS = {
            square: [
                ['1024x1024', '1k'],
                ['2048x2048', '2k'],
                ['2880x2880', '4k']
            ],
            portrait: [
                ['1024x1536', '1k'],
                ['1360x2048', '2k'],
                ['2352x3520', '4k']
            ],
            portrait43: [
                ['1008x1344', '1k'],
                ['1536x2048', '2k'],
                ['2448x3264', '4k']
            ],
            landscape43: [
                ['1344x1008', '1k'],
                ['2048x1536', '2k'],
                ['3264x2448', '4k']
            ],
            landscape: [
                ['1536x1024', '1k'],
                ['2048x1360', '2k'],
                ['3520x2352', '4k']
            ],
            story: [
                ['720x1280', '1k'],
                ['1152x2048', '2k'],
                ['2160x3840', '4k']
            ],
            wide: [
                ['1280x720', '1k'],
                ['2048x1152', '2k'],
                ['3840x2160', '4k']
            ]
        };
        const RES_LONG_SIDE = { '1k': 1536, '2k': 2048, '4k': 3840 };
        const RES_PIXEL_LIMIT = { '1k': 1572864, '2k': 4194304, '4k': 8294400 };

        function uniqueModels(list){
            const seen = new Set();
            return (list || []).map(item => String(item || '').trim()).filter(item => item && !seen.has(item) && seen.add(item));
        }
        function providerReadyForSelection(item){
            if(!item || item.enabled === false) return false;
            const id = String(item.id || '').trim().toLowerCase();
            const protocol = String(item.protocol || '').trim().toLowerCase();
            if(id === 'modelscope') return item.has_key === true;
            if(id === 'runninghub' || protocol === 'runninghub') return item.has_key === true || item.has_wallet_key === true;
            return true;
        }
        function imageProviders(){
            const list = (apiProviders || []).filter(p => providerReadyForSelection(p) && (
                (p.image_models || []).length || (p.rh_apps || []).length || (p.rh_workflows || []).length
            ));
            return list.length ? list : [{id:'comfly', name:'Comfly', image_models:[models.gpt, models.nano]}];
        }
        function providerById(id){
            return imageProviders().find(p => p.id === id) || imageProviders()[0];
        }
        function providerModels(id){
            return uniqueModels(providerById(id)?.image_models || [models.gpt]);
        }
        function modelResolutionTag(model){
            const match = String(model || '').trim().match(/(?:^|[-_])(1k|2k|4k)$/i);
            return match ? match[1].toLowerCase() : '';
        }
        function modelBaseName(model){
            return String(model || '').trim().replace(/[-_](?:1k|2k|4k)$/i, '');
        }
        function modelForResolution(model, nextResolution, providerId = provider){
            const res = String(nextResolution || '').toLowerCase();
            if(!model || !['1k','2k','4k'].includes(res) || isRunningHubProvider(providerId)) return model;
            const list = providerModels(providerId);
            const base = modelBaseName(model);
            const candidates = res === '1k'
                ? [base, `${base}-1k`, `${base}_1k`]
                : [`${base}-${res}`, `${base}_${res}`];
            const byLower = new Map(list.map(item => [String(item).toLowerCase(), item]));
            return candidates.map(item => byLower.get(item.toLowerCase())).find(Boolean) || model;
        }
        function syncSelectedModelForResolution(){
            const next = modelForResolution(selectedModel, resolution, provider);
            if(next && next !== selectedModel){
                selectedModel = next;
                return true;
            }
            return false;
        }
        function syncResolutionFromModel(model){
            const tag = modelResolutionTag(model);
            if(!tag) return false;
            resolution = tag;
            if(!ratio) ratio = 'square';
            customWidth = '';
            customHeight = '';
            return true;
        }
        /* ---- RunningHub：模型下拉来自 API 设置里配置的工作流 / AI 应用，而非通用 image_models ----
         * 与智能画布一致：value=app:ID / workflow:ID，后端 generate_ai_image 走 RH 工作流运行路径。 */
        function runningHubEntryId(entry, kind){
            if(!entry || typeof entry !== 'object') return '';
            const raw = kind === 'workflow' ? (entry.workflowId || entry.id) : (entry.appId || entry.webappId || entry.id);
            return String(raw || '').trim();
        }
        function runningHubEntries(id){
            const p = providerById(id) || {};
            const collect = (list, kind) => (list || [])
                .filter(e => e && e.enabled !== false && e.hidden !== true)
                .map(e => ({ kind, id: runningHubEntryId(e, kind), title: String(e.title || e.note || '').trim() }))
                .filter(e => e.id);
            return [...collect(p.rh_workflows, 'workflow'), ...collect(p.rh_apps, 'app')];
        }
        function isRunningHubProvider(id){ return providerProtocol(id) === 'runninghub'; }
        function renderProviderControls(){
            const providerSelect = document.getElementById('providerSelect');
            const modelSelect = document.getElementById('modelSelect');
            const providers = imageProviders();
            if(!providers.some(p => p.id === provider)) provider = providers[0]?.id || 'comfly';
            providerSelect.innerHTML = providers.map(p => `<option value="${escapeHtml(p.id)}" ${p.id === provider ? 'selected' : ''}>${escapeHtml(p.name || p.id)}</option>`).join('');
            if(isRunningHubProvider(provider)){
                const entries = runningHubEntries(provider);
                const keys = entries.map(e => `${e.kind}:${e.id}`);
                if(!keys.includes(selectedModel)) selectedModel = keys[0] || '';
                modelSelect.innerHTML = entries.length
                    ? entries.map(e => {
                        const key = `${e.kind}:${e.id}`;
                        const tag = e.kind === 'workflow' ? tr('online.rhWorkflow') : tr('online.rhApp');
                        const label = e.title || e.id;
                        return `<option value="${escapeHtml(key)}" ${key === selectedModel ? 'selected' : ''}>${escapeHtml(`[${tag}] ${label}`)}</option>`;
                    }).join('')
                    : `<option value="">${escapeHtml(tr('online.rhNoEntries'))}</option>`;
            } else {
                const modelsForProvider = providerModels(provider);
                if(!modelsForProvider.includes(selectedModel)) selectedModel = modelForResolution(modelsForProvider[0] || models.gpt, resolution, provider);
                modelSelect.innerHTML = modelsForProvider.map(m => `<option value="${escapeHtml(m)}" ${m === selectedModel ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('');
            }
            updateAdaptivePanel();
        }

        /* ---- 协议自适应：根据所选 provider 的 protocol 调整参数栏 ----
         * 后端 /api/online-image → generate_ai_image 已按协议分发，前端只需让
         * 与协议无关的控件随之显隐：质量仅 OpenAI 系（gpt-image）生效，其余协议忽略。 */
        function providerProtocol(id){
            const p = providerById(id) || {};
            const proto = String(p.protocol || '').toLowerCase();
            const pid = String(p.id || '').toLowerCase();
            const base = String(p.base_url || '').toLowerCase();
            if(proto === 'modelscope' || pid === 'modelscope') return 'modelscope';
            if(proto === 'runninghub' || pid === 'runninghub') return 'runninghub';
            if(proto === 'jimeng' || pid === 'jimeng') return 'jimeng';
            if(proto === 'volcengine' || pid === 'volcengine') return 'volcengine';
            if(proto === 'gemini') return 'gemini';
            if(proto === 'apimart' || base.includes('apimart.ai')) return 'apimart';
            return 'api';
        }
        const PROTOCOL_BADGE = {
            api:'online.modeApi', apimart:'online.modeApi', modelscope:'online.modeModelscope',
            runninghub:'online.modeRunningHub', jimeng:'online.modeJimeng',
            volcengine:'online.modeVolcengine', gemini:'online.modeGemini'
        };
        // 仅 OpenAI / APIMart（gpt-image 系）后端会消费 quality；其它协议忽略，隐藏以免误导。
        const QUALITY_PROTOCOLS = new Set(['api','apimart']);
        function updateAdaptivePanel(){
            const proto = providerProtocol(provider);
            const badge = document.getElementById('providerModeBadge');
            if(badge){
                badge.textContent = tr(PROTOCOL_BADGE[proto] || 'online.modeApi');
                badge.style.display = '';
            }
            const qf = document.getElementById('qualityField');
            if(qf) qf.style.display = QUALITY_PROTOCOLS.has(proto) ? '' : 'none';
            const qs = document.getElementById('qualitySelect');
            if(qs) qs.value = quality;
            // RunningHub 每次出图都是一次完整工作流运行，隐藏数量并固定为 1，避免误触发多次昂贵任务。
            if(proto === 'runninghub') outputCount = 1;
            const cf = document.getElementById('countField');
            if(cf) cf.style.display = (proto === 'runninghub') ? 'none' : '';
            const cs = document.getElementById('countSelect');
            if(cs) cs.value = String(outputCount);
            syncTemperatureControls();
        }
        function setQuality(next){ quality = next || 'auto'; }
        function setCount(next){ outputCount = Math.max(1, Math.min(4, parseInt(next, 10) || 1)); }
        function normalizedTemperature(value){
            const number = Number(value);
            if(!Number.isFinite(number)) return 0.7;
            return Math.max(0, Math.min(2, number));
        }
        function setTemperature(next){
            temperature = normalizedTemperature(next);
            syncTemperatureControls();
        }
        function syncTemperatureControls(){
            temperature = normalizedTemperature(temperature);
            const range = document.getElementById('temperatureRange');
            const input = document.getElementById('temperatureInput');
            if(range) range.value = String(temperature);
            if(input) input.value = temperature.toFixed(1);
        }

        async function initModels(){
            try {
                const cfg = await fetch('/api/config').then(r=>r.json());
                const imageModels = cfg.image_models || [];
                models.nano = imageModels.find(m => m.toLowerCase().includes('nano')) || 'nano-banana-pro';
                models.gpt = imageModels.find(m => !m.toLowerCase().includes('nano')) || cfg.image_model || 'gpt-image-2';
                apiProviders = Array.isArray(cfg.api_providers) ? cfg.api_providers : [];
                selectedModel = modelForResolution(providerModels(provider)[0] || models.gpt, resolution, provider);
            } catch(e) {}
            renderProviderControls();
        }
        // API 设置页保存后会广播 studio-api 事件；这里重新拉取 /api/config，
        // 尽量保留当前已选的平台/模型，renderProviderControls 会在其不存在时自动回退。
        async function refreshProvidersFromApiSettings(){
            try {
                const cfg = await fetch('/api/config').then(r=>r.json());
                const imageModels = cfg.image_models || [];
                models.nano = imageModels.find(m => m.toLowerCase().includes('nano')) || 'nano-banana-pro';
                models.gpt = imageModels.find(m => !m.toLowerCase().includes('nano')) || cfg.image_model || 'gpt-image-2';
                apiProviders = Array.isArray(cfg.api_providers) ? cfg.api_providers : [];
            } catch(e) { return; }
            renderProviderControls();
        }
        let apiSyncTimer = null;
        function scheduleProviderRefresh(){
            clearTimeout(apiSyncTimer);
            apiSyncTimer = setTimeout(refreshProvidersFromApiSettings, 150);
        }
        try {
            const studioApiChannel = new BroadcastChannel('studio-api');
            studioApiChannel.addEventListener('message', () => scheduleProviderRefresh());
        } catch(e) {}
        // 页面重新可见时也兜底刷新一次（切回标签页 / iframe 重新展示）
        document.addEventListener('visibilitychange', () => { if(!document.hidden) scheduleProviderRefresh(); });

        function setProvider(next){
            provider = next;
            selectedModel = modelForResolution(providerModels(provider)[0] || selectedModel, resolution, provider);
            renderProviderControls();
        }
        function setModel(next){
            selectedModel = next;
            if(syncResolutionFromModel(next)) updateSizeUI();
            updateAdaptivePanel();
        }
        function escapeHtml(str){ return String(str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
        function promptItemText(item){
            return String(item?.positive || item?.text || item?.prompt || '').trim();
        }
        function activePromptLibrary(){
            return promptLibraries.find(lib => lib.id === activePromptLibraryId) || promptLibraries[0] || {id:'system', name:'系统提示词库', items:[], categories:[]};
        }
        function promptCategoryName(lib, categoryId){
            if(categoryId === 'all') return '全部提示词';
            const cat = (lib?.categories || []).find(item => item.id === categoryId);
            return cat?.name || categoryId || '未分组';
        }
        async function loadPromptLibraries(force=false){
            const fresh = Date.now() - promptLibraryLoadedAt < 30000;
            if(promptLibraries.length && fresh && !force) return;
            const data = await fetch('/api/prompt-libraries').then(r => r.ok ? r.json() : {library:{libraries:[]}});
            promptLibraries = data.library?.libraries || [];
            promptLibraryLoadedAt = Date.now();
            activePromptLibraryId = data.library?.active_library_id || promptLibraries[0]?.id || 'system';
            activePromptCategory = 'all';
        }
        function filteredPromptItems(){
            const lib = activePromptLibrary();
            const query = promptLibraryQuery.trim().toLowerCase();
            return (lib.items || []).filter(item => {
                if(activePromptCategory !== 'all' && item.category !== activePromptCategory) return false;
                if(!query) return true;
                return `${item.name || ''} ${item.scene || ''} ${promptItemText(item)} ${item.negative || ''}`.toLowerCase().includes(query);
            });
        }
        function renderPromptLibraryPicker(){
            const lib = activePromptLibrary();
            const libraryList = document.getElementById('promptLibraryList');
            const categoryList = document.getElementById('promptCategoryList');
            const itemList = document.getElementById('promptItemList');
            if(!libraryList || !categoryList || !itemList) return;
            libraryList.innerHTML = promptLibraries.map(library => `
                <button type="button" class="prompt-lib-item ${library.id === lib.id ? 'active' : ''}" data-prompt-lib="${escapeHtml(library.id)}">
                    <span>${escapeHtml(library.name || '提示词库')}</span>
                    <small>${(library.items || []).length}</small>
                </button>
            `).join('') || '<div class="prompt-picker-empty">暂无提示词库</div>';
            const cats = [{id:'all', name:'全部提示词'}].concat(lib.categories || []);
            categoryList.innerHTML = cats.map(cat => {
                const count = cat.id === 'all' ? (lib.items || []).length : (lib.items || []).filter(item => item.category === cat.id).length;
                return `
                    <button type="button" class="prompt-cat-item ${cat.id === activePromptCategory ? 'active' : ''}" data-prompt-cat="${escapeHtml(cat.id)}">
                        <span>${escapeHtml(cat.name || cat.id)}</span>
                        <small>${count}</small>
                    </button>
                `;
            }).join('');
            const items = filteredPromptItems();
            itemList.innerHTML = items.map(item => {
                const text = promptItemText(item);
                return `
                    <article class="prompt-item-card" data-prompt-id="${escapeHtml(item.id)}">
                        <div class="prompt-item-top">
                            <div class="prompt-item-title" title="${escapeHtml(item.name || '提示词')}">${escapeHtml(item.name || '提示词')}</div>
                            <span class="prompt-item-tag">${escapeHtml(promptCategoryName(lib, item.category))}</span>
                        </div>
                        ${item.scene ? `<div class="text-[11px] font-bold text-slate-400 mb-1">${escapeHtml(item.scene)}</div>` : ''}
                        <div class="prompt-item-text">${escapeHtml(text || '这个提示词暂无正文')}</div>
                        <div class="prompt-item-actions">
                            <button type="button" class="prompt-action-btn" data-prompt-replace="${escapeHtml(item.id)}">替换</button>
                            <button type="button" class="prompt-action-btn primary" data-prompt-insert="${escapeHtml(item.id)}">插入</button>
                        </div>
                    </article>
                `;
            }).join('') || '<div class="prompt-picker-empty">没有匹配的提示词</div>';
            if(window.lucide) lucide.createIcons();
        }
        async function openPromptLibraryPicker(){
            try {
                await loadPromptLibraries(true);
                const modal = document.getElementById('promptLibraryModal');
                modal.classList.replace('hidden','flex');
                document.body.style.overflow = 'hidden';
                const search = document.getElementById('promptLibrarySearch');
                if(search) search.value = promptLibraryQuery = '';
                renderPromptLibraryPicker();
                setTimeout(() => search?.focus(), 50);
            } catch(err) {
                alert(`提示词库加载失败：${err.message || err}`);
            }
        }
        function closePromptLibraryPicker(){
            document.getElementById('promptLibraryModal')?.classList.replace('flex','hidden');
            document.body.style.overflow = 'auto';
        }
        function handlePromptLibraryOutside(event){
            if(event.target?.id === 'promptLibraryModal') closePromptLibraryPicker();
        }
        function findPromptItem(itemId){
            const lib = activePromptLibrary();
            return (lib.items || []).find(item => item.id === itemId);
        }
        function applyPromptLibraryItem(itemId, mode='insert'){
            const item = findPromptItem(itemId);
            const text = promptItemText(item);
            if(!text) return;
            const input = document.getElementById('promptInput');
            if(!input) return;
            if(mode === 'replace' || !input.value.trim()){
                input.value = text;
            } else {
                const start = input.selectionStart ?? input.value.length;
                const end = input.selectionEnd ?? input.value.length;
                const before = input.value.slice(0, start);
                const after = input.value.slice(end);
                const prefix = before && !before.endsWith('\n') ? '\n' : '';
                const suffix = after && !text.endsWith('\n') ? '\n' : '';
                input.value = `${before}${prefix}${text}${suffix}${after}`;
                const caret = (before + prefix + text).length;
                input.setSelectionRange(caret, caret);
            }
            input.focus();
            input.dispatchEvent(new Event('input', {bubbles:true}));
            closePromptLibraryPicker();
        }
        document.addEventListener('click', event => {
            const libBtn = event.target.closest?.('[data-prompt-lib]');
            if(libBtn){
                activePromptLibraryId = libBtn.dataset.promptLib || activePromptLibraryId;
                activePromptCategory = 'all';
                renderPromptLibraryPicker();
                return;
            }
            const catBtn = event.target.closest?.('[data-prompt-cat]');
            if(catBtn){
                activePromptCategory = catBtn.dataset.promptCat || 'all';
                renderPromptLibraryPicker();
                return;
            }
            const insertBtn = event.target.closest?.('[data-prompt-insert]');
            if(insertBtn){
                applyPromptLibraryItem(insertBtn.dataset.promptInsert, 'insert');
                return;
            }
            const replaceBtn = event.target.closest?.('[data-prompt-replace]');
            if(replaceBtn){
                applyPromptLibraryItem(replaceBtn.dataset.promptReplace, 'replace');
            }
        }, true);
        document.addEventListener('input', event => {
            if(event.target?.id === 'promptLibrarySearch'){
                promptLibraryQuery = event.target.value || '';
                renderPromptLibraryPicker();
            }
        });
        document.addEventListener('keydown', event => {
            if(event.key === 'Escape' && document.getElementById('promptLibraryModal')?.classList.contains('flex')){
                closePromptLibraryPicker();
            }
        });

        function parseSizeValue(value){
            const match = String(value || '').trim().match(/^(\d+)\s*[xX*]\s*(\d+)$/);
            return match ? {width:match[1], height:match[2]} : null;
        }
        function customRatioValue(){
            const w = Number(customRatioWidth);
            const h = Number(customRatioHeight);
            return w > 0 && h > 0 ? w / h : null;
        }
        function customSizeValue(){
            const w = Number(customWidth);
            const h = Number(customHeight);
            return w > 0 && h > 0 ? `${Math.round(w)}x${Math.round(h)}` : '';
        }
        function getImageDimensions(src){
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve({width:img.naturalWidth, height:img.naturalHeight});
                img.onerror = reject;
                img.src = src;
            });
        }
        function firstReferenceDimension(){
            return refSlotIds().map(id => refDims[id]).find(dim => dim?.width && dim?.height) || null;
        }

        function setRatio(next, preferredSize = ''){
            ratio = next;
            if (preferredSize) {
                const match = SIZE_OPTIONS[next]?.find(([value]) => value === preferredSize);
                if (match) resolution = match[1];
            }
            if(next !== 'custom') {
                customRatioWidth = '';
                customRatioHeight = '';
            }
            updateSizeUI();
        }

        function setCustomRatio(){
            customRatioWidth = document.getElementById('ratioCustomWidth').value;
            customRatioHeight = document.getElementById('ratioCustomHeight').value;
            ratio = 'custom';
            updateSizeUI();
        }

        function setCustomSize(){
            customWidth = document.getElementById('sizeCustomWidth').value;
            customHeight = document.getElementById('sizeCustomHeight').value;
            resolution = 'custom';
            ratio = '';
            updateSizeUI();
        }

        function setResolution(next){
            resolution = next;
            if(next === 'custom'){
                ratio = '';
            } else {
                customWidth = '';
                customHeight = '';
                if(ratio === '') ratio = 'square';
            }
            const modelChanged = syncSelectedModelForResolution();
            if(modelChanged) renderProviderControls();
            updateSizeUI();
        }

        function updateSizeUI(){
            const ratioSelect = document.getElementById('ratioSelect');
            const ratioField = document.getElementById('ratioField');
            const ratioCustomWidthInput = document.getElementById('ratioCustomWidth');
            const ratioCustomHeightInput = document.getElementById('ratioCustomHeight');
            const resolutionSelect = document.getElementById('resolutionSelect');
            const resolutionField = document.getElementById('resolutionField');
            const sizeCustomWidthInput = document.getElementById('sizeCustomWidth');
            const sizeCustomHeightInput = document.getElementById('sizeCustomHeight');
            const fitImageSizeBtn = document.getElementById('fitImageSizeBtn');
            ratioSelect.value = ratio;
            ratioSelect.disabled = resolution === 'custom';
            ratioField.classList.toggle('custom', ratio === 'custom');
            ratioCustomWidthInput.value = customRatioWidth;
            ratioCustomHeightInput.value = customRatioHeight;
            resolutionSelect.value = resolution;
            resolutionField.classList.toggle('custom', resolution === 'custom');
            sizeCustomWidthInput.value = customWidth;
            sizeCustomHeightInput.value = customHeight;
            if(fitImageSizeBtn) fitImageSizeBtn.disabled = !firstReferenceDimension();
            updateResolutionUI();
        }

        function updateResolutionUI(){}
        function fitCustomSizeToImage(event){
            if(event) event.preventDefault();
            const dim = firstReferenceDimension();
            if(!dim) return;
            resolution = 'custom';
            ratio = '';
            customWidth = dim.width;
            customHeight = dim.height;
            updateSizeUI();
        }

        function currentSize(){
            if(resolution === 'custom') return customSizeValue();
            const options = SIZE_OPTIONS[ratio] || SIZE_OPTIONS.square;
            if(ratio === 'custom'){
                const parsed = customRatioValue();
                const longSide = RES_LONG_SIDE[resolution] || 1024;
                if(parsed){
                    const pixelLimit = RES_PIXEL_LIMIT[resolution] || (longSide * longSide);
                    const rawWidth = parsed >= 1 ? longSide : Math.min(longSide * parsed, Math.sqrt(pixelLimit * parsed));
                    const rawHeight = parsed >= 1 ? Math.min(longSide / parsed, Math.sqrt(pixelLimit / parsed)) : longSide;
                    const width = Math.floor(rawWidth / 16) * 16;
                    const height = Math.floor(rawHeight / 16) * 16;
                    return `${Math.max(64, width)}x${Math.max(64, height)}`;
                }
            }
            const match = options.find(([, label]) => label === resolution) || SIZE_OPTIONS.square.find(([, label]) => label === resolution) || SIZE_OPTIONS.square[0];
            return match[0];
        }

        function refSlotIds(){ return Array.from({length:REF_SLOT_COUNT}, (_, index) => index + 1); }
        function resetReferenceState(){
            refs = {};
            refDims = {};
            refSlotIds().forEach(id => {
                refs[id] = null;
                refDims[id] = null;
            });
        }
        function renderReferenceSlots(){
            const grid = document.getElementById('referenceGrid');
            if(!grid) return;
            grid.innerHTML = refSlotIds().map(id => `
                <div id="drop-zone-${id}" onclick="document.getElementById('file${id}').click()" class="upload-item group aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                    <input type="file" id="file${id}" accept="image/*" class="hidden" onchange="handleFile(this.files[0],${id}); this.value='';">
                    <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">${escapeHtml(REF_SLOT_LABELS[id - 1] || `Ref ${id}`)}</span>
                    <img id="prev${id}" class="preview-img hidden"><button id="del${id}" onclick="clearSlot(${id},event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                </div>
            `).join('');
            refSlotIds().forEach(id => {
                const zone = document.getElementById(`drop-zone-${id}`);
                zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag-over'); };
                zone.ondragleave = () => zone.classList.remove('drag-over');
                zone.ondrop = e => { e.preventDefault(); zone.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0], id); };
            });
            lucide.createIcons();
        }
        function hydrateReferenceSlot(index, ref){
            refs[index] = ref || null;
            const prev = document.getElementById(`prev${index}`);
            const del = document.getElementById(`del${index}`);
            if(ref?.url && prev && del){
                prev.src = ref.url;
                prev.classList.remove('hidden');
                del.classList.remove('hidden');
                getImageDimensions(ref.url).then(dim => {
                    refDims[index] = dim;
                    updateSizeUI();
                }).catch(() => {});
            }
        }
        resetReferenceState();
        renderReferenceSlots();
        window.addEventListener('paste', e => {
            const item = [...(e.clipboardData?.items || [])].find(x => x.kind === 'file' && x.type.startsWith('image/'));
            if (item) handleFile(item.getAsFile(), firstEmptySlot());
        });
        function firstEmptySlot(){ return refSlotIds().find(id => !refs[id]) || 1; }

        async function handleFile(file, index){
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const prev = document.getElementById(`prev${index}`);
                prev.src = e.target.result; prev.classList.remove('hidden');
                document.getElementById(`del${index}`).classList.remove('hidden');
                getImageDimensions(e.target.result).then(dim => {
                    refDims[index] = dim;
                    updateSizeUI();
                }).catch(() => {});
            };
            reader.readAsDataURL(file);
            const form = new FormData();
            form.append('files', file);
            const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(r=>r.json());
            refs[index] = data.files[0];
        }
        function clearSlot(index, ev){
            if(ev) ev.stopPropagation();
            refs[index] = null;
            refDims[index] = null;
            document.getElementById(`prev${index}`).src = '';
            document.getElementById(`prev${index}`).classList.add('hidden');
            document.getElementById(`del${index}`).classList.add('hidden');
        }

        async function submitImage(){
            const prompt = document.getElementById('promptInput').value.trim();
            if(!prompt){ alert(tr('online.promptRequired')); return; }
            const btn = document.getElementById('genBtn'), loader = document.getElementById('loader'), placeholder = document.getElementById('placeholder'), out = document.getElementById('outputImg'), dl = document.getElementById('downloadBtn');
            btn.disabled = true; placeholder.classList.add('hidden'); out.classList.add('hidden'); dl.classList.add('hidden'); loader.classList.remove('hidden');
            try {
                const reqBody = { prompt, provider_id:provider, model:selectedModel, size:currentSize(), temperature:normalizedTemperature(temperature), n:outputCount, reference_images:refSlotIds().map(id => refs[id]).filter(Boolean).slice(0, REF_SLOT_COUNT) };
                if(QUALITY_PROTOCOLS.has(providerProtocol(provider))) reqBody.quality = quality;
                const result = await fetch('/api/online-image', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(reqBody)
                }).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || '生成失败'); return r.json(); });
                currentResult = result; out.src = result.images[0]; out.classList.remove('hidden'); dl.href = result.images[0]; dl.classList.remove('hidden'); renderImageCard(result, true);
            } catch(err) {
                alert(err.message || 'Generation failed'); placeholder.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden'); btn.disabled = false;
            }
        }

        function renderImageCard(data, isNew=false){
            if(!data.images?.[0] || document.getElementById(`history-${data.timestamp}`)) return;
            const card = document.createElement('div');
            card.id = `history-${data.timestamp}`;
            card.dataset.historyTs = data.timestamp;
            card.className = 'masonry-item group relative cursor-zoom-in';
            card.onclick = () => { if(document.body.classList.contains('history-bulk-selecting')) return; openLightbox(data); };
            const multi = Array.isArray(data.images) && data.images.length > 1
                ? `<div class="absolute top-3 right-3 bg-black/60 text-white text-[10px] font-black px-2 py-0.5 rounded-full pointer-events-none">×${data.images.length}</div>` : '';
            card.innerHTML = `<img src="${data.images[0]}" class="w-full h-full object-cover block group-hover:scale-105 transition-transform duration-1000" loading="lazy">${multi}
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 p-6 flex flex-col justify-end"><p class="text-white text-[10px] font-medium line-clamp-2 uppercase tracking-wider">${data.prompt || tr('online.onlineImageFallback')}</p></div>`;
            isNew ? document.getElementById('masonry').prepend(card) : document.getElementById('masonry').appendChild(card);
            lucide.createIcons();
        }
        async function loadHistory(page=0){
            if(isLoading) return; isLoading = true;
            const loader = document.getElementById('loadMoreTrigger');
            if(page === 0){ loader.innerText = tr('online.loadingArchives'); allHistory = await fetch('/api/history?type=online').then(r=>r.json()); document.getElementById('masonry').innerHTML=''; currentIndex=0; }
            const next = allHistory.slice(currentIndex, currentIndex + PAGE_SIZE);
            next.forEach(item => renderImageCard(item)); currentIndex += next.length;
            loader.classList.toggle('hidden', currentIndex >= allHistory.length);
            loader.innerText = tr('online.loadMore'); isLoading = false;
        }
        let lightboxPreview = null;
        function ensureLightboxPreview(){
            if(!lightboxPreview && window.StudioImagePreview){
                lightboxPreview = StudioImagePreview.attach(document.getElementById('lightboxFrame'));
            }
            return lightboxPreview;
        }
        function openLightbox(data){
            currentLightboxData = data;
            const img = document.getElementById('lightboxImg');
            const res = document.getElementById('lightboxRes');
            res.textContent = '...';
            ensureLightboxPreview();
            if(lightboxPreview) lightboxPreview.reset();
            img.onload = () => { res.textContent = img.naturalWidth && img.naturalHeight ? `${img.naturalWidth} x ${img.naturalHeight}` : (data.params?.size || '--'); };
            img.src = data.images[0];
            document.getElementById('lightboxPrompt').textContent = data.prompt || '';
            document.getElementById('lightbox').classList.replace('hidden','flex');
            document.body.style.overflow='hidden';
            lucide.createIcons();
        }
        function closeLightbox(){
            if(lightboxPreview) lightboxPreview.reset();
            document.getElementById('lightbox').classList.replace('flex','hidden');
            document.body.style.overflow='auto';
        }
        function handleOutsideClick(e){ if(e.target.id === 'lightbox') closeLightbox(); }
        function handleInspirationOutside(e){ if(e.target.id === 'inspirationPickerModal') closeInspirationPicker(); }
        function inspirationTags(){
            return (document.getElementById('inspirationTagsInput')?.value || '').split(/[,，、\n]/).map(s => s.trim()).filter(Boolean);
        }
        function defaultInspirationTitle(data){
            const model = data?.model || data?.params?.model || '';
            const prompt = String(data?.prompt || '').trim();
            return (model ? `${model} · ` : '') + (prompt ? prompt.slice(0, 42) : '在线生图');
        }
        async function openInspirationPicker(){
            if(!currentLightboxData?.images?.[0]) return;
            const modal = document.getElementById('inspirationPickerModal');
            const select = document.getElementById('inspirationCategorySelect');
            const title = document.getElementById('inspirationTitleInput');
            select.innerHTML = '<option value="uncategorized">未分类</option>';
            try {
                const data = await fetch('/api/inspiration-space').then(r => r.json());
                const cats = data.space?.categories || [];
                select.innerHTML = cats.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('') || '<option value="uncategorized">未分类</option>';
            } catch(err) {
                console.warn('load inspiration categories failed', err);
            }
            title.value = defaultInspirationTitle(currentLightboxData);
            document.getElementById('inspirationTagsInput').value = '';
            document.getElementById('inspirationNotesInput').value = '';
            modal.classList.replace('hidden', 'flex');
            lucide.createIcons();
        }
        function closeInspirationPicker(){
            document.getElementById('inspirationPickerModal')?.classList.replace('flex', 'hidden');
        }
        async function saveOnlineInspiration(){
            const data = currentLightboxData;
            if(!data?.images?.[0]) return;
            const btn = document.getElementById('saveInspirationBtn');
            btn.disabled = true;
            const params = data.params || {};
            const payload = {
                category_id:document.getElementById('inspirationCategorySelect').value || 'uncategorized',
                title:document.getElementById('inspirationTitleInput').value || defaultInspirationTitle(data),
                image_url:data.images[0],
                source_url:data.images[0],
                source_type:'online',
                prompt:data.prompt || '',
                provider_id:data.provider_id || params.provider_id || '',
                provider_name:data.provider_name || params.provider_name || '',
                model:data.model || params.model || '',
                ratio:params.ratio || params.aspect_ratio || '',
                size:params.size || '',
                seed:String(params.seed || ''),
                tags:inspirationTags(),
                notes:document.getElementById('inspirationNotesInput').value || '',
                params:{
                    ...params,
                    quality:data.quality || params.quality || '',
                    temperature:data.temperature ?? params.temperature,
                    n:Array.isArray(data.images) ? data.images.length : params.n,
                },
                references:params.reference_images || [],
                source_record_id:String(data.timestamp || data.id || ''),
            };
            try {
                const res = await fetch('/api/inspiration-space/items', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
                if(!res.ok) {
                    const detail = (await res.json()).detail || '保存失败';
                    throw new Error(detail === 'Not Found' ? '灵感空间接口未加载，请重启本地服务后再试。' : detail);
                }
                closeInspirationPicker();
                alert('已加入灵感空间');
            } catch(err) {
                alert(err.message || '保存失败');
            } finally {
                btn.disabled = false;
            }
        }
        async function downloadLightboxImage(e){
            e.stopPropagation();
            const url = currentLightboxData?.images?.[0];
            if(!url) return;
            const res = await fetch(url);
            if(!res.ok) return alert('下载失败');
            const blob = await res.blob();
            const clean = url.split('?')[0];
            const ext = clean.includes('.') ? clean.split('.').pop() : 'png';
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `online-image-${Date.now()}.${ext || 'png'}`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }
        function zoomImage(){ if(currentResult) openLightbox(currentResult); }
        function applySameStyle(){
            if(!currentLightboxData) return;
            document.getElementById('promptInput').value = currentLightboxData.prompt || '';
            refSlotIds().forEach(id => clearSlot(id));
            (currentLightboxData.params?.reference_images || []).slice(0, REF_SLOT_COUNT).forEach((ref,i) => hydrateReferenceSlot(i + 1, ref));
            setTemperature(currentLightboxData.params?.temperature ?? 0.7);
            const size = currentLightboxData.params?.size || '1024x1024';
            const matchedRatio = Object.keys(SIZE_OPTIONS).find(key => SIZE_OPTIONS[key].some(([value]) => value === size)) || 'square';
            const matchedRes = SIZE_OPTIONS[matchedRatio]?.find(([value]) => value === size)?.[1];
            if(matchedRes) {
                setRatio(matchedRatio, size);
                setResolution(matchedRes);
            } else {
                setResolution('custom');
                const parsed = parseSizeValue(size);
                customWidth = parsed?.width || '';
                customHeight = parsed?.height || '';
                updateSizeUI();
            }
            closeLightbox(); window.scrollTo({top:0, behavior:'smooth'});
        }
        async function deleteHistoryItem(ts, ev){
            ev.stopPropagation();
            if(!confirm(tr('online.deleteConfirm'))) return;
            const res = await fetch('/api/history/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({timestamp:ts})}).then(r=>r.json());
            if(res.success) document.getElementById(`history-${ts}`)?.remove();
        }
        const observer = new IntersectionObserver(entries => { if(entries[0].isIntersecting && currentIndex < allHistory.length) loadHistory(1); }, {threshold:.1});
        window.onload = async () => {
            applyLanguage();
            setRatio('square');
            setResolution('1k');
            await initModels();
            await loadHistory(0);
            window.HistoryBulkManager?.attach({masonry:'#masonry'});
            const trigger = document.getElementById('loadMoreTrigger');
            if(trigger){
                observer.observe(trigger);
                trigger.onclick = () => loadHistory(1);
            }
        };
    </script>
</body>
